/* Google Maps: format /maps/dir/A/B/C/ — svaku stanicu traži zasebno,
   kao da si je sam utipkao. Kratice se raspisuju jer ih Google krivo tumači. */
function normAdr(a){
 let t=String(a||"").trim()
  .replace(/\bul\.\s*/gi,"ulica ")
  .replace(/\bcest\.\s*/gi,"cesta ")
  .replace(/\bav\.\s*/gi,"avenija ")
  .replace(/\btrg\.\s*/gi,"trg ")
  .replace(/\s{2,}/g," ").trim();
 if(!/zagreb/i.test(t))t+=", Zagreb";
 if(!/hrvatska|croatia/i.test(t))t+=", Hrvatska";
 return t;}
const dioPuta=a=>encodeURIComponent(normAdr(a)).replace(/%20/g,"+");
const NAZIV_NAV={google:"Google Maps",apple:"Apple Maps"};
function rutaLink(st){
 if(!st.length)return "#";
 if(NAV==="apple")
  return `https://maps.apple.com/?saddr=${encodeURIComponent(ADRESA_NAV)}&daddr=`
   +st.map(o=>encodeURIComponent(normAdr(o.adresa))).join("+to:")+"&dirflg=d";
 const dom=dioPuta(ADRESA_NAV);
 const stanice=st.map(o=>dioPuta(o.adresa)).join("/");
 return `https://www.google.com/maps/dir/${dom}/${stanice?stanice+"/":""}${dom}/?travelmode=driving`;}
function jednaRuta(o){
 const a=normAdr(o.adresa);
 if(NAV==="apple")return `https://maps.apple.com/?daddr=${encodeURIComponent(a)}&dirflg=d`;
 return `https://www.google.com/maps/dir/${dioPuta(ADRESA_NAV)}/${dioPuta(o.adresa)}/?travelmode=driving`;}
const trazi=a=>`https://www.google.com/maps/search/${dioPuta(a)}`;
async function uzmi(id){
 const t=ture.find(x=>x.id===id); if(!t||t.vozac)return;
 const moja=ture.find(x=>x.vozac===vozac&&x.stanje==="preuzeta");
 if(moja){
  // vec vozim turu — spoji nove narudzbe u nju
  const r=await sb.from("narudzbe").update({tura_id:moja.id,stanje:"u_dostavi",
    uzeta_u:new Date().toISOString(),vozac}).eq("tura_id",id);
  if(r.error){alert("Greška pri spajanju u turu: "+r.error.message);await osvjezi();return;}
  await sb.from("ture").update({stanje:"zavrsena"}).eq("id",id);
 } else {
  // preuzimanje ponuđene ture — probaj s vozilom, a ako to padne (npr. stupac/vozilo ne valja) probaj bez njega
  let up=await sb.from("ture").update({vozac,vozilo_id:voziloId,stanje:"preuzeta"})
   .eq("id",id).is("vozac",null).select();
  if(up.error)up=await sb.from("ture").update({vozac,stanje:"preuzeta"})
   .eq("id",id).is("vozac",null).select();
  if(up.error||!up.data||!up.data.length){
   alert(tj("Preuzimanje ture nije uspjelo (možda ju je netko drugi već preuzeo). Pokušaj ponovno."));
   await osvjezi();return;}
  const r2=await sb.from("narudzbe").update({stanje:"u_dostavi",uzeta_u:new Date().toISOString(),vozac})
   .eq("tura_id",id);
  if(r2.error)alert("Tura je preuzeta, ali narudžbe nisu ažurirane: "+r2.error.message);}
 await osvjezi();}
function poredaj(st){
 if(st.length<2)return st;
 const R=L();
 if(st.length>6||st.some(o=>!o.lat)){
  return st.slice().sort((a,b)=>km(R,a)-km(R,b));}
 const perms=p=>p.length<=1?[p]:p.flatMap((x,i)=>perms([...p.slice(0,i),...p.slice(i+1)]).map(r=>[x,...r]));
 let best=st,bd=Infinity;
 for(const p of perms(st)){
  let d=km(R,p[0]);
  for(let i=0;i<p.length-1;i++)d+=km(p[i],p[i+1]);
  d+=km(p[p.length-1],R);
  if(d<bd){bd=d;best=p;}}
 return best;}
function duljinaRute(st){
 if(!st.length)return 0;
 const R=L(); let d=km(R,st[0]);
 for(let i=0;i<st.length-1;i++)d+=km(st[i],st[i+1]);
 return cestKm(d+km(st[st.length-1],R));}
/* Oznake na karti kao pravi Google Maps marker (SVG ikona umjesto Leaflet divIcon-a) —
   narančasti krug s brojem stanice, crveni krug "P" za pizzeriju (isti izgled kao prije). */
function svgOznakaUrl(oznaka,dom){
 const boja=dom?"#D0021B":"#E8622A";
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30">`+
  `<circle cx="15" cy="15" r="13" fill="${boja}" stroke="rgba(11,9,8,.85)" stroke-width="2"/>`+
  `<text x="15" y="19.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" `+
  `font-size="13" fill="#fff">${esc(oznaka)}</text></svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);}
function kartaRute(id,st){
 const div=el(id); if(!div)return;
 const tocke=[{lat:+lokal.lat,lng:+lokal.lng,oz:"P",naz:lokal.adresa,dom:1}]
  .concat(st.filter(o=>o.lat).map((o,i)=>({lat:+o.lat,lng:+o.lng,oz:String(i+1),naz:o.adresa})));
 if(tocke.length<2){div.innerHTML='<div class="karta-prazno">Adrese još nisu pronađene na karti</div>';return;}
 if(!window.google||!google.maps||!google.maps.Map){
  div.innerHTML='<div class="karta-prazno">Karta se učitava…</div>';return;}
 try{
  const m=new google.maps.Map(div,{zoomControl:true,streetViewControl:false,
   mapTypeControl:false,fullscreenControl:false,gestureHandling:"cooperative"});
  const bounds=new google.maps.LatLngBounds();
  tocke.forEach(t=>{
   const pos={lat:t.lat,lng:t.lng};
   bounds.extend(pos);
   new google.maps.Marker({position:pos,map:m,title:t.naz,
    icon:{url:svgOznakaUrl(t.oz,t.dom),scaledSize:new google.maps.Size(30,30),
     anchor:new google.maps.Point(15,15)}});});
  new google.maps.Polyline({
   path:tocke.map(t=>({lat:t.lat,lng:t.lng})).concat([{lat:tocke[0].lat,lng:tocke[0].lng}]),
   strokeColor:"#E8622A",strokeWeight:3,strokeOpacity:1,map:m});
  m.fitBounds(bounds,40);
 }catch(e){div.innerHTML='<div class="karta-prazno">Karta se nije učitala</div>';}}
const mozeVratiti=o=>!o.uzeta_u||(Date.now()-new Date(o.uzeta_u).getTime())/60000<=ROK_VRACANJA();
const ostaloZaVratiti=o=>Math.max(0,Math.ceil(ROK_VRACANJA()-(Date.now()-new Date(o.uzeta_u||Date.now()).getTime())/60000));
async function vratiNarudzbu(id){
 const o=narudzbe.find(x=>x.id===id);
 if(!o||!mozeVratiti(o)){alert(tj("Rok od "+ROK_VRACANJA()+" minuta je istekao. Narudžbu je potrebno dostaviti."));return;}
 if(!confirm(tj("Vratiti narudžbu #"+o.broj+" u ponudu?")))return;
 const r0=await sb.from("narudzbe").update({tura_id:null,stanje:"spremno",uzeta_u:null,vozac:null}).eq("id",id);
 if(javiGresku(r0,"vrati narudžbu"))return;
 const t=ture.find(x=>x.id===o.tura_id);
 if(t){const ost=narudzbe.filter(x=>x.tura_id===t.id&&x.id!==id);
  if(!ost.length)await sb.from("ture").update({stanje:"zavrsena"}).eq("id",t.id);}
 await osvjezi();}
async function uzmiSamu(id){
 const o=narudzbe.find(x=>x.id===id); if(!o)return;
 const moja=ture.find(x=>x.vozac===vozac&&x.stanje==="preuzeta");
 if(moja){const r=await sb.from("narudzbe").update({tura_id:moja.id,stanje:"u_dostavi",
   uzeta_u:new Date().toISOString(),vozac}).eq("id",id);
  if(r.error)alert("Greška: "+r.error.message);
  await osvjezi(); return;}
 const km0=o.lat?cestKm(2*km(L(),o)):0; // procjena: tamo i natrag
 let t=await sb.from("ture").insert({lokal_id:lokal.id,vozac,vozilo_id:voziloId,stanje:"preuzeta",
  kvart:(o.naselje||o.adresa.split(",")[0]||"Dostava").trim(),ukupno_km:km0}).select().single();
 if(t.error)t=await sb.from("ture").insert({lokal_id:lokal.id,vozac,stanje:"preuzeta",
  kvart:(o.naselje||o.adresa.split(",")[0]||"Dostava").trim(),ukupno_km:km0}).select().single();
 if(t.error){alert("Preuzimanje nije uspjelo: "+t.error.message);await osvjezi();return;}
 const r2=await sb.from("narudzbe").update({tura_id:t.data.id,stanje:"u_dostavi",
  uzeta_u:new Date().toISOString(),vozac}).eq("id",id);
 if(r2.error)alert("Tura je stvorena, ali narudžba nije spojena: "+r2.error.message);
 await osvjezi();}
async function kasnimJa(id){
 const m=prompt(tj("Za koliko minuta kasniš? Upiši 5, 10, 15 ili 20."),"10");
 const n=parseInt(m); if(!n||n<1)return;
 const o=narudzbe.find(x=>x.id===id);
 const r=await sb.from("narudzbe").update({kasnjenje:(o.kasnjenje||0)+n}).eq("id",id);
 if(javiGresku(r,"prijava kašnjenja"))return;
 await osvjezi();}
async function isporucio(id){
 const r=await sb.from("narudzbe").update({dostavljeno:true}).eq("id",id);
 if(javiGresku(r,"dostavljeno"))return;
 await osvjezi();}
async function pripisiKm(voziloId2,dodajKm){
 const v=await sb.from("vozila").select("km").eq("id",voziloId2).single();
 if(v.error||!v.data)return;
 await sb.from("vozila").update({km:Math.round((+v.data.km||0)+dodajKm)}).eq("id",voziloId2);}
async function zavrsi(id){
 const t=ture.find(x=>x.id===id);
 const nars=narudzbe.filter(o=>o.tura_id===id);
 const r1=await sb.from("ture").update({stanje:"zavrsena"}).eq("id",id);
 if(javiGresku(r1,"završi turu"))return;
 const r2=await sb.from("narudzbe").update({stanje:"dostavljeno"}).eq("tura_id",id);
 if(javiGresku(r2,"završi turu"))return;
 if(t&&t.vozilo_id&&+t.ukupno_km>0)await pripisiKm(t.vozilo_id,+t.ukupno_km);
 nars.forEach(o=>otvoreneStanice.delete(o.id));
 await osvjezi();}

function glatkoNaEl(id){
 const t=typeof id==="string"?el(id):id; if(!t)return;

}

/* ==================== NARUDŽBA TELEFONOM (u kuhinjskom sučelju) ====================
   Operater na kasi otvori formu, upiše broj mobitela i — ako je gost već naručivao —
   sustav sam popuni ime, adresu, kat, stan, portafon i napomenu iz tablice kupci.
   Zatim se bira hrana kroz brzi jelovnik (bez marketinškog dijela koji gost vidi),
   pa pregled, pa "Završi narudžbu": narudžba se sprema VEĆ PRIHVAĆENA (u_pripremi),
   odmah ide na pult i vozaču, i broji se kupcu u program vjernosti kao i web narudžba. */
let telNar=null, telKosarica=[], telOtvoreno=null, telGotova=null;

function telPocni(){
 telNar={korak:"podaci",tel:"",ime:"",prezime:"",adresa:"",kat:"",stan:"",portafon:"",
   napomena:"",nacin:"dostava",placanje:"gotovina",naselje:"",lat:null,lng:null,
   nadjen:false,dostavljenih:0,eta:20,greska:""};
 telKosarica=[]; telOtvoreno=null; telGotova=null; crtaj(1);}

function telOdustani(){
 if((telKosarica.length||telNar&&telNar.tel)&&!confirm(tj("Odbaciti započetu telefonsku narudžbu?")))return;
 telNar=null; telKosarica=[]; telGotova=null; crtaj(1);}

// upis u polja NE crta ekran (inače bi svaka tipka gubila fokus) — vrijednost se samo pamti
function telPolje(k,v){ if(telNar)telNar[k]=v; }

async function telTrazi(){
 const t=samoBrojke(el("tel-tel")?el("tel-tel").value:"");
 if(t.length<8){telNar.greska="Upišite ispravan broj mobitela.";crtaj(1);return;}
 telNar.tel=t; telNar.greska="";
 const r=await sb.from("kupci").select("*").eq("lokal_id",lokal.id).eq("tel",t).maybeSingle();
 if(r.data){
  const k=r.data;
  telNar.nadjen=true;
  telNar.ime=k.ime||""; telNar.prezime=k.prezime||"";
  telNar.adresa=k.adresa||""; telNar.kat=k.kat||""; telNar.stan=k.stan||"";
  telNar.portafon=k.portafon||""; telNar.napomena=k.napomena||"";
  telNar.naselje=k.naselje||""; telNar.lat=k.lat||null; telNar.lng=k.lng||null;
  telNar.dostavljenih=k.dostavljenih||0;
 } else { telNar.nadjen=false; telNar.dostavljenih=0; }
 crtaj(2);}   // 2 = ne vraćaj upisani tekst, jer baš njega mijenjamo

// prikupi sve što je operater upisao u polja prije prelaska na sljedeći ekran
function telPokupi(){
 ["tel","ime","prezime","adresa","kat","stan","portafon","napomena"].forEach(k=>{
  const e=el("tel-"+k); if(e)telNar[k]=k==="tel"?samoBrojke(e.value):e.value.trim();});}

function telNaMeni(){
 telPokupi();
 if(telNar.tel.length<8){telNar.greska="Upišite ispravan broj mobitela.";crtaj(1);return;}
 if(!telNar.ime){telNar.greska="Upišite ime gosta.";crtaj(1);return;}
 if(telNar.nacin==="dostava"&&telNar.adresa.length<5){telNar.greska="Upišite adresu dostave.";crtaj(1);return;}
 telNar.greska=""; telNar.korak="meni"; crtaj(1); scrollTo(0,0);}

function telNatrag(k){ telNar.korak=k; crtaj(1); scrollTo(0,0);}

function telOtvori(id){ telOtvoreno=telOtvoreno===id?null:id; crtaj(1);}

function telBrzo(id){ telKosarica.push({jeloId:id,dodaci:[],uz:[]}); telOtvoreno=null; crtaj(1);}

function telUKosaricu(id){
 const d=[...document.querySelectorAll(`[data-td="${id}"]:checked`)].map(x=>x.value);
 const u=[...document.querySelectorAll(`[data-tu="${id}"]:checked`)].map(x=>x.value);
 telKosarica.push({jeloId:id,dodaci:d,uz:u}); telOtvoreno=null; crtaj(1);}

function telIzbaci(i){ telKosarica.splice(i,1); crtaj(1);}

function telNaPregled(){
 if(!telKosarica.length){alert(tj("Dodajte barem jedno jelo."));return;}
 telNar.korak="pregled"; crtaj(1); scrollTo(0,0);}

async function telZavrsi(){
 const g=el("tel-zavrsi"); if(g){g.disabled=true;g.textContent=tj("Spremam…");}
 const r=racun(telKosarica);
 const punaAdresa=telNar.nacin==="osobno"
   ?("Osobno preuzimanje u lokalu — "+lokal.adresa)
   :[telNar.adresa,telNar.kat?"kat "+telNar.kat:"",telNar.stan?"stan "+telNar.stan:"",
     telNar.portafon?"portafon "+telNar.portafon:""].filter(Boolean).join(", ");
 // koordinate za vozača: ako ih kupac već ima spremljene koristi njih, inače geokodiraj sad
 let lat=telNar.lat,lng=telNar.lng,naselje=telNar.naselje;
 if(telNar.nacin!=="osobno"&&!lat){
  try{const n=await nadiAdrese(telNar.adresa);
   if(n.length){lat=n[0].lat;lng=n[0].lng;naselje=n[0].naselje||naselje;}}catch(e){}}
 const voznja=(lat&&lng)?minute(km(L(),{lat,lng})):0;
 const eta=+telNar.eta||20;
 const osnovno={lokal_id:lokal.id,
   ime:(telNar.ime+" "+telNar.prezime).trim(),telefon:telNar.tel,
   adresa:punaAdresa,naselje:telNar.nacin==="osobno"?null:(naselje||null),
   napomena:telNar.napomena||null,placanje:telNar.placanje||"gotovina",
   iznos:r.ukupno,popust:r.popust,gratis_pice:r.gratisPice,
   stanje:"u_pripremi",eta:eta,voznja_min:voznja,eta_gostu:eta+voznja+REZERVA(),
   lat:telNar.nacin==="osobno"?null:lat,lng:telNar.nacin==="osobno"?null:lng,
   nacin:telNar.nacin==="osobno"?"osobno":"dostava"};
 // stupci koje starija baza možda nema — skidaj ih postupno dok insert ne prođe
 const opcionalno=["izvor","nacin","naselje","kupac_tel","lojalnost"];
 let payload={...osnovno,izvor:"telefon",kupac_tel:telNar.tel,lojalnost:r.lojalnost};
 let ins=await sb.from("narudzbe").insert(payload).select().single();
 let pok=0;
 while(ins.error&&pok<opcionalno.length+1){
  const msg=ins.error.message||"";
  let pog=opcionalno.find(k=>k in payload&&new RegExp(k,"i").test(msg));
  if(!pog&&/schema cache/i.test(msg))pog=opcionalno.find(k=>k in payload);
  if(!pog)break;
  delete payload[pog]; pok++;
  ins=await sb.from("narudzbe").insert(payload).select().single();}
 if(ins.error){
  alert(tj("Greška pri spremanju: ")+ins.error.message);
  if(g){g.disabled=false;g.textContent=tj("Završi narudžbu");}
  return;}
 const redovi=telKosarica.map(s=>({lokal_id:lokal.id,narudzba_id:ins.data.id,
   naziv:jelo(s.jeloId).naziv,cijena:cijenaStavke(s),
   dodaci:s.dodaci.map(i=>dod(i).naziv).join(", "),
   uz:s.uz.filter(i=>jelo(i).kategorija==="Piće").map(i=>jelo(i).naziv).join(", ")
     +"‖"+s.uz.filter(i=>jelo(i).kategorija==="Deserti").map(i=>jelo(i).naziv).join(", ")}));
 await sb.from("stavke").insert(redovi);
 // zapamti gosta s punim podacima, da sljedeći put sve iskoči samo na broj telefona
 const kupacZapis={lokal_id:lokal.id,tel:telNar.tel,ime:telNar.ime,prezime:telNar.prezime,
   adresa:telNar.nacin==="osobno"?null:telNar.adresa,kat:telNar.kat||null,stan:telNar.stan||null,
   portafon:telNar.portafon||null,napomena:telNar.napomena||null,
   naselje:naselje||null,lat:lat||null,lng:lng||null};
 let up=await sb.from("kupci").upsert(kupacZapis,{onConflict:"lokal_id,tel"});
 if(up.error){ // starija baza bez novih stupaca — spremi barem ime i prezime
  await sb.from("kupci").upsert({lokal_id:lokal.id,tel:telNar.tel,
    ime:telNar.ime,prezime:telNar.prezime},{onConflict:"lokal_id,tel"});}
 telGotova={broj:ins.data.broj,id:ins.data.id,
   stavke:telKosarica.map(s=>({...s})),racun:r,
   ime:(telNar.ime+" "+telNar.prezime).trim(),tel:telNar.tel,
   adresa:punaAdresa,napomena:telNar.napomena,eta:eta,
   nacin:telNar.nacin,placanje:telNar.placanje};
 telNar.korak="gotovo";
 odsviraj("narudzba");
 await osvjezi();
 crtaj(1); scrollTo(0,0);}

   </div>
   <div class="box">
    <div class="tel-red">
     <div style="flex:1"><label class="f" for="tel-ime">Ime</label>

  <div class="slip-nas">RIKY'S PIZZA</div>
  <div class="slip-broj">NARUDŽBA #${t.broj}</div>

  ${t.stavke.map(s=>`<div class="slip-stavka">
    <div><b>${esc(jelo(s.jeloId).naziv)}</b> <span>${eur(cijenaStavke(s))}</span></div>
    ${s.dodaci.length?`<div class="slip-pod">+ ${s.dodaci.map(d=>esc(dod(d).naziv)).join(", ")}</div>`:""}

   </div>`).join("")}
  <div class="slip-crta"></div>
  <div class="slip-ukupno">UKUPNO: ${eur(t.racun.ukupno)}</div>
  <div class="slip-red">${t.placanje==="kartica"?"KARTICA na vratima":"GOTOVINA"}</div>

 </div>`;}

/* ==================== ISPIS NA BLUETOOTH TERMALNI PISAČ (58mm) ====================
   Web Bluetooth radi u Chromeu na Androidu, Windowsu, macOS-u i Linuxu.
   NE radi u Safariju na iPhoneu/iPadu — ondje Apple ne dopušta Bluetooth iz web stranice. */
let blePisac=null;
const BLE_SERVISI=[0x18f0,"000018f0-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455","e7810a71-73ae-499d-8c15-faa9aef0c3f2"];

function bleStatus(t){const e=el("ble-status"); if(e)e.textContent=t;}

/* Termalni pisači najčešće nemaju hrvatska slova. bezKvacica() već postoji gore u
   datoteci (koristi se za pretragu adresa) i skida dijakritiku, pa je ovdje samo
   nadopunjujemo znakovima koje normalize() ne rastavlja (đ, €, crtice). */
const pisacTekst=s=>bezKvacica(String(s||""))
 .replace(/đ/g,"dj").replace(/Đ/g,"Dj")
 .replace(/€/g,"EUR").replace(/–|—|‖/g,"-");

function slipTekst(t){
 const L=[];
 L.push("      RIKY'S PIZZA");
 L.push("     NARUDZBA #"+t.broj);
 L.push(new Date().toLocaleString("hr-HR"));
 L.push("--------------------------------");
 L.push(t.ime);
 L.push(t.tel);
 L.push(t.adresa);
 if(t.napomena)L.push("NAPOMENA: "+t.napomena);
 L.push("--------------------------------");
 t.stavke.forEach(s=>{
  L.push(jelo(s.jeloId).naziv+"  "+eur(cijenaStavke(s)));
  if(s.dodaci.length)L.push("  + "+s.dodaci.map(d=>dod(d).naziv).join(", "));
  if(s.uz.length)L.push("  uz: "+s.uz.map(u=>jelo(u).naziv).join(", "));});
 L.push("--------------------------------");
 L.push("UKUPNO: "+eur(t.racun.ukupno));
 L.push(t.placanje==="kartica"?"KARTICA na vratima":"GOTOVINA");
 L.push("Gotovo iz peci za "+t.eta+" min");
 L.push(""); L.push(""); L.push("");
 return pisacTekst(L.join("\n"))+"\n";}

async function bleSpoji(){
 if(!navigator.bluetooth)
  throw new Error("Ovaj uređaj/preglednik ne podržava Bluetooth ispis. Na iPhoneu i iPadu to nije moguće — treba Android tablet ili računalo s Chromeom.");
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVISI});
 const gatt=await dev.gatt.connect();
 for(const s of BLE_SERVISI){
  try{
   const sv=await gatt.getPrimaryService(s);
   const ch=(await sv.getCharacteristics()).find(c=>c.properties.write||c.properties.writeWithoutResponse);
   if(ch){blePisac={dev,ch};
    dev.addEventListener("gattserverdisconnected",()=>{blePisac=null;});
    return blePisac;}
  }catch(e){}
 }
 throw new Error("Pisač je spojen, ali ne prepoznajem njegov kanal za ispis. Javi koji je model pisača.");}

async function bleIspisi(){
 if(!telGotova)return;
 try{
  bleStatus(tj("Tražim pisač…"));
  if(!blePisac||!blePisac.dev.gatt.connected)await bleSpoji();
  bleStatus(tj("Šaljem na pisač…"));
  const enc=new TextEncoder();
  const glava=new Uint8Array([0x1b,0x40]);            // ESC @ — reset pisača
  const tijelo=enc.encode(slipTekst(telGotova));
  const rez=new Uint8Array([0x1d,0x56,0x42,0x00]);    // GS V B — rez papira
  const sve=new Uint8Array(glava.length+tijelo.length+rez.length);
  sve.set(glava,0); sve.set(tijelo,glava.length); sve.set(rez,glava.length+tijelo.length);
  for(let i=0;i<sve.length;i+=180){
   const dio=sve.slice(i,i+180);
   if(blePisac.ch.writeValueWithoutResponse)await blePisac.ch.writeValueWithoutResponse(dio);
   else await blePisac.ch.writeValue(dio);
   await new Promise(r=>setTimeout(r,25));}
  bleStatus(tj("Ispisano."));
 }catch(e){
  bleStatus((e&&e.message)?e.message:tj("Ispis nije uspio."));}}

/* ==================== PULT — KUHINJA PROIZVODNJA (#pult) ====================
   Tablet kod peći. Vidi se SAMO hrana koja se radi — bez imena, adresa i telefona.
   Velika slova, sve čitljivo iz ruke. Narudžbe koje idu istom vozaču (ista tura) ili
   u isti kvart prikazane su zajedno, s oznakom da se peku skupa. */
function pultHTML(){
 const rad=narudzbe.filter(o=>o.stanje==="u_pripremi");
 const spremne=narudzbe.filter(o=>o.stanje==="spremno");
 // grupiranje: prvo po turi (ako je vozačka tura već složena), inače po kvartu
 const grupe={};
 rad.forEach(o=>{
  const k=o.tura_id?("T:"+o.tura_id):("K:"+((o.naselje||"").trim()||"—"));
  (grupe[k]=grupe[k]||[]).push(o);});
 const kljucevi=Object.keys(grupe).sort((a,b)=>grupe[b].length-grupe[a].length);
 return `<div class="pult">
  <div class="pult-vrh"><h1>PROIZVODNJA</h1>
   <div class="pult-brojke"><span>U RADU <b>${rad.length}</b></span><span>SPREMNO <b>${spremne.length}</b></span></div></div>
  ${rad.length?kljucevi.map(k=>{
   const g=grupe[k]; const skupa=g.length>1;
   const oznaka=k.startsWith("T:")?"IDU ISTOM VOZAČU":(k.slice(2)!=="—"?k.slice(2):"");
   return `<div class="pult-grupa ${skupa?"skupa":""}">
    ${skupa?`<div class="pult-grupa-vrh">PEĆI ZAJEDNO — ${g.length} NARUDŽBE${oznaka?" · "+esc(oznaka):""}</div>`:""}
    ${g.map(o=>pultKartica(o)).join("")}</div>`;}).join("")
   :`<div class="pult-prazno">NEMA NARUDŽBI U RADU</div>`}
  ${spremne.length?`<div class="pult-spremne"><h2>SPREMNO — ČEKA VOZAČA</h2>
    ${spremne.map(o=>`<div class="pult-spr-red">#${o.broj} · ${pultStavke(o).length} stavki</div>`).join("")}</div>`:""}
 </div>`;}

function pultStavke(o){return o.stavke||[];}

function pultKartica(o){
 const st=pultStavke(o);
 const proslo=Math.round((Date.now()-new Date(o.stvoreno).getTime())/60000);
 return `<div class="pult-kartica">
  <div class="pult-kartica-vrh">
   <div class="pult-broj">#${o.broj}</div>
   <div class="pult-vrijeme">${proslo} min ${o.nacin==="osobno"?"· OSOBNO":""}${o.izvor==="telefon"?" · TELEFON":""}</div>
  </div>
  ${st.length?st.filter(s=>s.naziv!=="Dostava").map(s=>{
   const j=jela.find(x=>x.naziv===s.naziv);
   const uz=(s.uz||"").split("‖");
   return `<div class="pult-stavka">
    <div class="pult-jelo">${esc(s.naziv)}</div>
    ${j&&j.opis?`<div class="pult-sastav">${esc(j.opis)}</div>`:""}
    ${s.dodaci?`<div class="pult-dodatak">+ ${esc(s.dodaci)}</div>`:""}
    ${uz[0]?`<div class="pult-uz">PIĆE: ${esc(uz[0])}</div>`:""}
    ${uz[1]?`<div class="pult-uz">DESERT: ${esc(uz[1])}</div>`:""}
   </div>`;}).join("")
   :`<div class="pult-stavka"><div class="pult-jelo">—</div></div>`}
  ${o.napomena?`<div class="pult-napomena">NAPOMENA: ${esc(o.napomena)}</div>`:""}
  <button class="pult-gumb" onclick="stanje('${o.id}','spremno')">SPREMNO ✓</button>
 </div>`;}


start();
</script>
