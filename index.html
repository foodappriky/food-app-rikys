<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riky's Pizza</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0908">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riky's Pizza">
<!-- Google Maps — geokodiranje adresa (nadiGoogle) I karta rute za vozača (kartaRute); ako ne uspije učitati
     (spor internet, blokiran CDN), adrese padaju natrag na Nominatim/Geoapify, a karta pokaže poruku
     "Karta se učitava…" umjesto da se sruši. Leaflet/CARTO (OpenStreetMap pločice) uklonjeni — CARTO-ove
     besplatne pločice počele su tražiti API ključ ("API KEY REQUIRED" na karti), a korisnik svakako
     želi pravi Google Maps izgled karte, ne OpenStreetMap. -->
<script>window.__gmapsOk=false;window.googleMapsSpreman=function(){window.__gmapsOk=true;};</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAOVYRIgupAurZup5y1PRh8Ismb1A3lLao&libraries=places&callback=googleMapsSpreman"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body.svijetlo{--bg:#F1E7D6;--bg2:#FAF3E6;--card:#FAF3E6;--line:#B29B6E;--line2:#8C734A;
 --cream:#1C1614;--dim:#4A4038;--dim2:#5E5044;--or:#C44E1C;--gold:#A9741F;
 --red:#B00218;--go:#2E7A45;--wait:#8A6410;--pice:#1F6C93;--des:#7D3C8C;--bw:2px}
/* Naslovnica (hero) uvijek zadržava tamnu fotografiju s njoj namijenjenim svijetlim tekstom,
   bez obzira na temu stranice — inače se fotografija peći gubi na svijetloj pozadini. */
.hero-in{--cream:#F6EFE8;--dim:#B0A099;--dim2:#7A6C66;--or:#E8622A;--gold:#E9A44C;color:var(--cream)}
body.svijetlo .vjernost{background:var(--card)}
body.svijetlo .m-kuh{background:rgba(196,78,28,.12)}
body.svijetlo .onama{background:linear-gradient(180deg,rgba(46,122,69,.08),#fff 55%)}
/* Podebljani rubovi/tekst VRIJEDE U OBJE TEME (korisnik je tražio "svega ali svega",
   ne samo svijetli mod) — pravila su editirana izravno na njihovim osnovnim definicijama
   niže u ovoj datoteci (.sec h3, .prazno, .zvuk-ok, .podtab button, .jelo-o) umjesto
   posebnog override bloka ovdje, jer bi override ranije u datoteci izgubio od kasnije
   definirane osnovne klase iste specifičnosti. */
.karta{width:100%;height:230px;border-radius:10px;border:var(--bw) solid var(--line);margin-bottom:11px;
 background:var(--bg2);overflow:hidden}
.karta-prazno{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim2);font-size:13px}
.on-glava{display:block;width:100%;background:transparent;border:0;text-align:center;padding:4px 0;color:var(--cream)}
.on-glava h3{color:var(--cream)}
.on-strelica{display:block;color:var(--dim2);font-size:13px;margin-top:8px}
.on-tekst{margin-top:18px;padding-top:18px;border-top:var(--bw) solid var(--line)}
.on-tekst p{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.85;
 color:var(--dim);max-width:600px;margin:0 auto 16px;text-align:center;font-style:italic}
.on-tekst p.prvi::first-letter{font-size:26px;line-height:1;color:var(--gold);
 font-style:normal;font-weight:700}
.on-tekst .on-ukras{color:var(--gold);font-size:15px;margin-bottom:14px}

.nav-izbor{display:flex;gap:7px;align-items:center;margin:12px 18px 0;flex-wrap:wrap}
.nav-izbor>span{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--dim2);flex:0 0 100%}
.nav-izbor button{flex:1;min-width:96px;padding:11px 8px;border:var(--bw) solid var(--line2);
 background:transparent;color:var(--dim);border-radius:8px;font-family:"Oswald",sans-serif;
 font-size:12.5px;text-transform:uppercase}
.natrag{display:block;width:calc(100% - 36px);margin:12px 18px 0;padding:12px;border-radius:9px;
 border:1px solid var(--gold);background:rgba(233,164,76,.12);color:var(--gold);
 font-family:"Oswald",sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:.06em}
.jelo-sl{width:60px;height:60px;object-fit:cover;border-radius:9px;border:var(--bw) solid var(--line2)}
.jelo-ured{display:flex;gap:12px;align-items:flex-start}
.jelo-polja{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.sl-okvir{flex:0 0 92px;text-align:center}
.sl-okvir img{width:92px;height:92px;object-fit:cover;border-radius:9px;border:var(--bw) solid var(--line2);
 display:block;margin-bottom:6px}
.sl-prazno{width:92px;height:92px;border:var(--bw) solid var(--line2);border-radius:9px;display:flex;
 align-items:center;justify-content:center;color:var(--dim2);font-size:11px;margin-bottom:6px}
.sl-okvir .btn{width:100%;margin-top:4px}
.kat-glava{display:flex;gap:8px;align-items:center;padding:20px 18px 8px}
.rucka{flex:none;width:20px;height:20px;color:var(--dim2);cursor:grab;display:flex;align-items:center;justify-content:center}
.rucka svg{width:100%;height:100%;fill:currentColor}
.rucka:active{cursor:grabbing}
.jelo-ured .rucka{align-self:center}
.rucka-kat{color:var(--dim)}
.kat-ime{font-family:"Anton",sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.strelice{display:flex;gap:4px}
.strelice button{width:38px;height:38px;border:var(--bw) solid var(--line2);background:transparent;
 color:var(--cream);border-radius:7px;font-size:13px;cursor:pointer}
.strelice button:disabled{opacity:.3}
.obrisi{width:38px;height:38px;flex:none;border:var(--bw) solid var(--line2);background:transparent;
 color:var(--red);border-radius:7px;font-size:15px;cursor:pointer}
.jed{font-size:12px;color:var(--dim2);min-width:28px}
.jed-zadano{font-size:11.5px;color:var(--dim2);flex:1;padding-top:11px}
.racunica{margin-top:14px;border:var(--bw) solid var(--line2);border-radius:10px;overflow:hidden}
.racunica>div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
 border-bottom:var(--bw) solid var(--line)}
.racunica>div:last-child{border-bottom:0}
.racunica span{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.06em;color:var(--dim2)}
.racunica b{font-family:"IBM Plex Mono",monospace;font-size:17px}
.racunica .crveno{color:var(--red)}.racunica .zeleno{color:var(--go)}
.racunica .ist{background:rgba(232,98,42,.14)}.racunica .ist b{color:var(--or);font-size:19px}
.trosak{display:flex;gap:10px;align-items:center;background:var(--card);border:var(--bw) solid var(--line);
 border-radius:10px;padding:11px 13px;margin:0 18px 8px}
.trosak.pl{border-color:var(--go);background:rgba(78,155,95,.07)}
.kvaka{width:38px;height:38px;flex:none;border-radius:9px;border:2px solid var(--line2);
 background:transparent;color:var(--go);font-size:19px;line-height:1;cursor:pointer}
.kvaka.on{border-color:var(--go);background:rgba(78,155,95,.2)}
.tr-b{flex:1;min-width:0}
.tr-v{display:block;font-size:10.5px;color:var(--dim2);margin-top:3px;letter-spacing:.05em;
 font-family:"Oswald",sans-serif;text-transform:uppercase}
.tr-i{max-width:104px;text-align:right;font-family:"IBM Plex Mono",monospace}
.zum-omot{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);flex-direction:column}
body.zum-otvoren{overflow:hidden}
.zum-vrh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
 padding-top:calc(14px + env(safe-area-inset-top))}
.zum-vrh span{font-family:"Oswald",sans-serif;text-transform:uppercase;color:var(--cream);font-size:14px}
.zum-vrh button{padding:13px 22px;border:0;background:var(--or);color:#fff;
 border-radius:999px;font-family:"Oswald",sans-serif;text-transform:uppercase;font-size:14.5px;
 font-weight:600;letter-spacing:.06em;box-shadow:0 4px 16px rgba(232,98,42,.5);
 transition:transform .15s ease,box-shadow .15s ease}
.zum-vrh button:active{transform:scale(.94);box-shadow:0 2px 8px rgba(232,98,42,.4)}
.zum-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
 touch-action:pinch-zoom pan-x pan-y}
.zum-scroll img{max-width:none;width:100%;height:auto;touch-action:pinch-zoom}
@media (min-width:700px){.zum-scroll img{width:auto;max-height:88vh;max-width:92vw}}
/* ---- upute "Dodaj na početni zaslon" (PWA) — zamjenjuje golu alert() poruku ---- */
.pwa-upute-omot{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.6);
 display:none;align-items:flex-end;justify-content:center}
.pwa-upute-omot.otvoren{display:flex}
.pwa-kartica{position:relative;width:100%;max-width:440px;background:var(--card);
 border:var(--bw) solid var(--line2);border-bottom:none;border-radius:16px 16px 0 0;
 padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.pwa-zatvori{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;
 border:var(--bw) solid var(--line2);background:transparent;color:var(--dim);font-size:15px;
 display:flex;align-items:center;justify-content:center}
.pwa-kartica h3{font-family:"Oswald",sans-serif;text-transform:none;font-size:17px;
 padding-right:32px;margin-bottom:6px}
.pwa-kartica>p{color:var(--dim2);font-size:13.5px;margin-bottom:16px}
.pwa-korak{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:var(--bw) solid var(--line)}
.pwa-korak:first-of-type{border-top:none;padding-top:0}
.pwa-broj{flex:none;width:24px;height:24px;border-radius:50%;background:var(--or);color:#fff;
 font-family:"Oswald",sans-serif;font-weight:600;font-size:13px;display:flex;align-items:center;
 justify-content:center}
.pwa-ikona{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
 color:var(--or)}
.pwa-ikona svg{width:100%;height:100%}
.pwa-korak>span:last-child{font-size:14.5px}
.undo{display:block;width:calc(100% - 36px);margin:12px 18px 0;padding:12px;border-radius:9px;
 border:1px solid var(--wait);background:rgba(201,154,46,.12);color:var(--wait);
 font-family:"Oswald",sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}
.zap-red{padding:12px;border:var(--bw) solid var(--line);border-radius:9px;margin-bottom:10px;background:var(--bg2)}
.konto b{font-family:"Oswald",sans-serif;font-size:16px;text-transform:uppercase}
.kat-lista{min-height:8px}
.ord.nedostupno{opacity:.55}
.kat-blok{position:relative}
.kat-blok.vuceni-kat{opacity:.5;box-shadow:inset 0 0 0 2px var(--or);border-radius:10px}
.ord.vuceni{opacity:.4}
.rb i{background:var(--gold)}
.redak{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:var(--bw) solid var(--line)}
.redak:last-child{border-bottom:0}
.rn{flex:0 0 40%;font-size:14px;line-height:1.25}
.rb{flex:1;height:9px;background:var(--bg2);border-radius:5px;overflow:hidden}
.rb i{display:block;height:100%;border-radius:5px}
.rk{flex:0 0 60px;text-align:right;font-size:13.5px}
.re{flex:0 0 72px;text-align:right;font-size:13px;color:var(--dim2)}
.uj-red{display:flex;gap:8px;align-items:center}
.uj-red .f{flex:1}
.nav-info{flex:0 0 100%;font-style:normal;font-size:12.5px;color:var(--dim2);margin-top:4px}
.nav-info b{color:var(--or)}
.nav-izbor button.tren{border-color:var(--or);color:var(--or);background:rgba(232,98,42,.1);font-weight:600}
.rec-omot{margin-top:26px;padding:22px 0 6px;border-top:var(--bw) solid var(--line)}
.rec-naslov{font-family:"Anton",sans-serif;font-size:22px;letter-spacing:.08em;text-transform:uppercase;
 text-align:center;margin-bottom:16px}
.rec-traka{overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
 mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.rec-tok{display:flex;gap:12px;width:max-content;animation:klizi 90s linear infinite}
.rec-traka:hover .rec-tok{animation-play-state:paused}
@keyframes klizi{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rec{flex:0 0 260px;background:var(--card);border:var(--bw) solid var(--line);border-radius:11px;padding:14px}
.rec .zvj{color:var(--gold);font-size:13px;letter-spacing:.12em;margin-bottom:7px}
.rec p{font-size:14px;color:var(--dim);line-height:1.5;min-height:63px}
.rec b{display:block;margin-top:9px;font-family:"Oswald",sans-serif;font-size:12.5px;
 letter-spacing:.06em;text-transform:uppercase;color:var(--cream)}
@media (prefers-reduced-motion:reduce){.rec-tok{animation:none;overflow-x:auto}}
.uvjeti-dostave{display:flex;gap:9px;padding:14px 18px 0;flex-wrap:wrap}
.uvjeti-dostave>div{flex:1;min-width:118px;border:var(--bw) solid var(--line2);border-radius:9px;
 padding:11px 12px;text-align:center;background:var(--card)}
.uvjeti-dostave b{display:block;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.07em;
 text-transform:uppercase;color:var(--dim2);margin-bottom:4px}
.uvjeti-dostave span{font-family:"Oswald",sans-serif;font-size:16px;font-weight:600;color:var(--gold)}
.upoz-min{margin-top:12px;padding:13px;border:1.5px solid var(--wait);border-radius:9px;
 background:rgba(201,154,46,.12);color:var(--wait);font-size:14px;line-height:1.5}
.bar .l i{font-style:normal;opacity:.85}
.stanice-kratko{margin:4px 0 10px}
.sk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:var(--bw) solid var(--line)}
.sk:last-child{border-bottom:0}
.skb{width:24px;height:24px;flex:none;border-radius:50%;background:var(--or);color:#fff;
 font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;display:flex;align-items:center;
 justify-content:center;margin-top:2px}
.sk b{display:block;font-family:"Oswald",sans-serif;font-size:15.5px;font-weight:600;color:var(--gold)}
.sk i{display:block;font-style:normal;font-size:12.5px;color:var(--dim2);margin-top:2px}
.redoslijed{font-size:13px;color:var(--dim);margin:8px 0 4px;line-height:1.5}
.dodatne{margin-top:14px;padding-top:12px;border-top:var(--bw) solid var(--line)}
.dodatne>b{display:block;font-family:"Oswald",sans-serif;font-size:11.5px;letter-spacing:.1em;
 color:var(--dim2);margin-bottom:9px}
.dod-red{display:flex;gap:10px;align-items:center;padding:9px 11px;border:var(--bw) solid var(--line);
 border-radius:9px;margin-bottom:7px}
.dod-red.pase{border-color:var(--go);background:rgba(78,155,95,.08)}
.dod-red .b{flex:1;min-width:0}
.dod-red h4{font-family:"Oswald",sans-serif;font-size:14.5px;font-weight:500;text-transform:none}
.dod-red p{font-size:12.5px;color:var(--dim2)}
.ns i.des{color:var(--des)}
body.bljesak{animation:bl .35s steps(1) 4}
@keyframes bl{0%,100%{background:var(--bg)}50%{background:#5A1A08}}
.zv-greska{margin:6px 18px 0;padding:10px 12px;border:1px solid var(--red);border-radius:8px;
 color:var(--red);font-size:13px;background:rgba(208,2,27,.1)}
.zv-savjet{margin-top:12px;padding-top:12px;border-top:var(--bw) solid var(--line);font-size:13px;color:var(--dim2)}
.zv-savjet b{color:var(--wait)}
.zv-savjet ul{margin:8px 0 0;padding-left:17px}
.zv-savjet li{margin-bottom:6px;line-height:1.45}
.zv-red input[type=checkbox]{width:22px;height:22px;accent-color:var(--or)}
.zv-panel{margin:8px 18px 0;padding:14px;border:var(--bw) solid var(--line2);border-radius:10px;background:var(--card)}
.zv-red{display:flex;gap:10px;align-items:center;padding:7px 0}
.zv-red>span{flex:0 0 130px;font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.05em;
 text-transform:uppercase;color:var(--dim2)}
.zv-red select{flex:1}
.zv-red input[type=range]{flex:1;accent-color:var(--or)}
.zvuk-off,.zvuk-ok{display:block;width:calc(100% - 36px);margin:12px 18px 0;padding:12px;
 border-radius:9px;font-family:"Oswald",sans-serif;text-transform:uppercase;font-size:13px;
 letter-spacing:.05em}
.zvuk-off{border:2px solid var(--red);background:rgba(208,2,27,.12);color:var(--red)}
.zvuk-ok{border:var(--bw) solid var(--line2);background:transparent;color:var(--dim2);font-size:13px;font-weight:600;padding:8px}
/* ---- gornja traka: jezik / tema / vjernost / instalacija ----
   Korisnik: ranije su ovo bili kružići koji lebde preko naslovne fotografije — ružno i
   nejasno čemu služe. Sad je to prava traka na samom vrhu stranice (dio normalnog toka,
   NE position:fixed) — ima svoju pozadinu i rub, i pomiče se/nestaje kako se stranica
   skrola prema dolje, umjesto da trajno lebdi preko sadržaja. */
.topbar{position:relative;z-index:40;display:flex;align-items:center;
 justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:9px 12px;
 padding-top:calc(9px + env(safe-area-inset-top));
 background:var(--bg2);border-bottom:var(--bw) solid var(--line)}
.tb-btn{width:40px;height:40px;flex:none;border-radius:50%;border:var(--bw) solid var(--line2);
 background:var(--card);color:var(--dim);font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.18);
 display:flex;align-items:center;justify-content:center;line-height:1}
.tb-btn.wide{width:auto;padding:0 13px;gap:7px;font-family:"Oswald",sans-serif;font-size:12px;
 text-transform:uppercase;letter-spacing:.04em;color:var(--cream);font-weight:600}
.pwa-logo{width:20px;height:20px;border-radius:5px;display:block}
.tema{color:var(--dim)}
.tema:active{color:var(--or);border-color:var(--or)}
.jez-switch{position:relative;flex:none}
.jez-trenutni{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--line2);
 background:var(--card);font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.jez-lista{display:none;position:absolute;right:0;top:48px;background:var(--card);
 border:var(--bw) solid var(--line2);border-radius:10px;overflow:hidden;min-width:170px;
 box-shadow:0 8px 24px rgba(0,0,0,.4)}
.jez-switch.otvoren .jez-lista{display:block}
.jez-lista button{display:flex;gap:8px;align-items:center;width:100%;padding:10px 12px;
 border:none;background:transparent;color:var(--cream);font-size:14px;text-align:left;
 font-family:"Barlow Semi Condensed",system-ui,sans-serif}
.jez-lista button.on{background:rgba(232,98,42,.15);color:var(--or);font-weight:600}
.jez-lista button:not(:last-child){border-bottom:var(--bw) solid var(--line)}
:root{--bg:#0B0908;--bg2:#151110;--card:#1C1614;--line:#3D322D;--line2:#5A4A42;
 --cream:#F6EFE8;--dim:#B0A099;--dim2:#8C7D76;--or:#E8622A;--gold:#E9A44C;
 --red:#D0021B;--go:#4E9B5F;--wait:#C99A2E;--pice:#3E9CC9;--des:#B96BC7;--bw:2px;
 --safe-top:env(safe-area-inset-top,0px)} /* čita se u JS-u (glatkoNaEl) da skok na kategoriju zaobiđe i iPhone notch i sticky traku */
/* Korisnik je tražio da su rubovi/tekst podebljani u SVIM temama i na SVA 4 sučelja,
   ne samo u svijetlom modu — zato je --bw:2px ovdje na :root (vrijedi uvijek), a --line/
   --line2/--dim2 su malo posvijetljeni i za tamnu temu radi boljeg kontrasta. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Barlow Semi Condensed",system-ui,sans-serif;background:var(--bg);color:var(--cream);
 -webkit-font-smoothing:antialiased;line-height:1.45;font-size:16px}
.wrap{max-width:620px;margin:0 auto;padding-bottom:112px}

function narudzbePauzirane(){

 const d=pauzaDoDatuma(); if(!d)return false;
 return d.getHours()===23&&d.getMinutes()>=59;}

"Povrće režemo svježe svaki dan. Bez prečaca, bez zamrznutog i bez kompromisa. Zato naša pizza ima okus kakav pamtite.":{en:"We cut our vegetables fresh every day. No shortcuts, nothing frozen, no compromises. That's why our pizza tastes like the one you remember.",de:"Unser Gemüse schneiden wir jeden Tag frisch. Keine Abkürzungen, nichts Gefrorenes, keine Kompromisse. Deshalb schmeckt unsere Pizza so, wie Sie sie in Erinnerung haben.",it:"Tagliamo le verdure fresche ogni giorno. Niente scorciatoie, niente surgelati, nessun compromesso. Per questo la nostra pizza ha il sapore che ricordi.",fr:"Nous coupons nos légumes frais chaque jour. Pas de raccourcis, rien de surgelé, aucun compromis. C'est pourquoi notre pizza a le goût dont vous vous souvenez.",es:"Cortamos las verduras frescas cada día. Sin atajos, sin congelados, sin compromisos. Por eso nuestra pizza tiene el sabor que recuerdas."},

"Plaća svakog aktivnog zaposlenika sama se upisuje kao mjesečni trošak (bruto + doprinosi), i vidi se u popisu iznad. Neaktivnog zaposlenika isključi umjesto brisanja ako mu čuvaš povijest.":{en:"Each active employee's salary (gross + contributions) is entered automatically as a monthly expense and shown in the list above. Deactivate an inactive employee instead of deleting them if you want to keep their history.",de:"Das Gehalt jedes aktiven Mitarbeiters (brutto + Abgaben) wird automatisch als monatliche Ausgabe eingetragen und oben in der Liste angezeigt. Deaktivieren Sie einen nicht mehr aktiven Mitarbeiter, statt ihn zu löschen, wenn Sie seine Historie behalten möchten.",it:"Lo stipendio di ogni dipendente attivo (lordo + contributi) viene inserito automaticamente come spesa mensile e appare nell'elenco sopra. Disattiva un dipendente non più attivo invece di eliminarlo se vuoi conservarne lo storico.",fr:"Le salaire de chaque employé actif (brut + charges) est saisi automatiquement comme dépense mensuelle et apparaît dans la liste ci-dessus. Désactivez un employé inactif plutôt que de le supprimer si vous voulez garder son historique.",es:"El salario de cada empleado activo (bruto + cotizaciones) se registra automáticamente como gasto mensual y aparece en la lista de arriba. Desactiva a un empleado inactivo en vez de eliminarlo si quieres conservar su historial."},

"Vozači se prijavljuju imenom i PIN-om, a vozilo biraju sami pri prijavi — vozila se uređuju u kartici „Vozni park”.":{en:"Drivers log in with their name and PIN, and choose their vehicle themselves at login — vehicles are managed in the \"Fleet\" tab.",de:"Fahrer melden sich mit Namen und PIN an und wählen ihr Fahrzeug selbst bei der Anmeldung — Fahrzeuge werden im Reiter „Fuhrpark\" verwaltet.",it:"I fattorini accedono con nome e PIN e scelgono da soli il veicolo al login — i veicoli si gestiscono nella scheda \"Parco veicoli\".",fr:"Les livreurs se connectent avec leur nom et leur code PIN, et choisissent eux-mêmes leur véhicule à la connexion — les véhicules se gèrent dans l'onglet « Flotte ».",es:"Los repartidores inician sesión con su nombre y PIN, y eligen su vehículo ellos mismos al iniciar sesión — los vehículos se gestionan en la pestaña \"Flota\"."},

"Vozač bira vozilo pri prijavi. Kad završi turu, prijeđeni kilometri (procjena iz rute) sami se\n  zbroje na vozilo — tako se km i trošak goriva vode automatski, bez ručnog upisivanja.":{en:"The driver chooses their vehicle at login. When they finish a route, the distance driven (estimated from the route) is added to the vehicle automatically — so km and fuel cost are tracked without manual entry.",de:"Der Fahrer wählt sein Fahrzeug bei der Anmeldung. Nach Abschluss einer Tour werden die gefahrenen Kilometer (aus der Route geschätzt) automatisch dem Fahrzeug zugerechnet — so werden km und Spritkosten ohne manuelle Eingabe erfasst.",it:"Il fattorino sceglie il veicolo al login. Al termine di un giro, i chilometri percorsi (stimati dal percorso) si sommano automaticamente al veicolo — così km e costo del carburante si registrano senza inserimento manuale.",fr:"Le livreur choisit son véhicule à la connexion. À la fin d'une tournée, les kilomètres parcourus (estimés depuis l'itinéraire) s'ajoutent automatiquement au véhicule — les km et le coût du carburant sont ainsi suivis sans saisie manuelle.",es:"El repartidor elige su vehículo al iniciar sesión. Al terminar una ruta, los kilómetros recorridos (estimados a partir de la ruta) se suman automáticamente al vehículo — así los km y el coste de combustible se registran sin introducción manual."},

"Dok je pizzeria ne prihvati, možete je otkazati ili poslati izmjenu porukom. Nakon potvrde priprema kreće i izmjene se dogovaraju s kuhinjom.":{en:"Until the pizzeria accepts it, you can cancel it or send a change by message. After confirmation, preparation begins and changes are arranged with the kitchen.",de:"Solange die Pizzeria sie nicht angenommen hat, können Sie sie stornieren oder eine Änderung per Nachricht senden. Nach der Bestätigung beginnt die Zubereitung und Änderungen werden mit der Küche abgesprochen.",it:"Finché la pizzeria non lo accetta, puoi annullarlo o inviare una modifica tramite messaggio. Dopo la conferma la preparazione inizia e le modifiche si concordano con la cucina.",fr:"Tant que la pizzeria ne l'a pas acceptée, vous pouvez l'annuler ou envoyer une modification par message. Après confirmation, la préparation commence et les modifications se négocient avec la cuisine.",es:"Mientras la pizzería no lo acepte, puedes cancelarlo o enviar un cambio por mensaje. Tras la confirmación, la preparación comienza y los cambios se acuerdan con la cocina."},

"Otkazivanje putem stranice više nije moguće. Za svaku izmjenu — adresu, sastojke ili broj telefona — pošaljite poruku kuhinji ili nazovite. Potrudit ćemo se izaći u susret ako priprema još nije gotova.":{en:"Cancelling through the website is no longer possible. For any change — address, ingredients, or phone number — please message the kitchen or call. We'll try to accommodate you if preparation isn't finished yet.",de:"Eine Stornierung über die Website ist nicht mehr möglich. Für jede Änderung — Adresse, Zutaten oder Telefonnummer — schreiben Sie der Küche eine Nachricht oder rufen Sie an. Wir bemühen uns entgegenzukommen, falls die Zubereitung noch nicht fertig ist.",it:"L'annullamento tramite il sito non è più possibile. Per qualsiasi modifica — indirizzo, ingredienti o numero di telefono — scrivi un messaggio alla cucina o chiama. Cercheremo di venirti incontro se la preparazione non è ancora finita.",fr:"L'annulation via le site n'est plus possible. Pour toute modification — adresse, ingrédients ou numéro de téléphone — envoyez un message à la cuisine ou appelez. Nous ferons de notre mieux si la préparation n'est pas terminée.",es:"Ya no es posible cancelar desde la web. Para cualquier cambio — dirección, ingredientes o teléfono — escribe un mensaje a la cocina o llama. Intentaremos ayudarte si la preparación aún no ha terminado."},

"Akcija 4+1 primjenjuje se automatski: na svakih pet naručenih pizza najjeftinija se odbija od konačnog iznosa. Uz svaku pizzu isporučujemo Coca-Colu 0,33 L bez naplate. Vrijedi za narudžbe putem naše izravne dostave.":{en:"The 4+1 offer applies automatically: for every five pizzas ordered, the cheapest is deducted from the final amount. We deliver a Coca-Cola 0.33 L free with every pizza. Valid for orders through our direct delivery.",de:"Die 4+1-Aktion gilt automatisch: Bei je fünf bestellten Pizzen wird die günstigste vom Endbetrag abgezogen. Zu jeder Pizza liefern wir eine Coca-Cola 0,33 L kostenlos. Gültig für Bestellungen über unsere Direktlieferung.",it:"La promo 4+1 si applica automaticamente: ogni cinque pizze ordinate, la più economica viene detratta dal totale. Con ogni pizza consegniamo una Coca-Cola 0,33 L gratuita. Valido per gli ordini tramite la nostra consegna diretta.",fr:"L'offre 4+1 s'applique automatiquement : pour cinq pizzas commandées, la moins chère est déduite du montant final. Nous livrons une Coca-Cola 0,33 L gratuite avec chaque pizza. Valable pour les commandes via notre livraison directe.",es:"La oferta 4+1 se aplica automáticamente: por cada cinco pizzas pedidas, la más barata se descuenta del total. Con cada pizza entregamos una Coca-Cola 0,33 L gratis. Válido para pedidos por nuestro reparto directo."},
"NAPOMENA O NARUČIVANJU":{en:"ORDERING NOTICE",de:"HINWEIS ZUR BESTELLUNG",it:"AVVISO SULL'ORDINE",fr:"REMARQUE SUR LA COMMANDE",es:"AVISO SOBRE EL PEDIDO"},
"Slanjem narudžbe potvrđujete točnost podataka. Namjerno lažno naručivanje kojim se prouzroči imovinska šteta može predstavljati kazneno djelo prijevare iz članka 236. Kaznenog zakona.":{en:"By submitting an order you confirm the accuracy of your details. Deliberately placing a false order that causes financial harm may constitute the criminal offense of fraud under Article 236 of the Croatian Criminal Code.",de:"Mit dem Absenden der Bestellung bestätigen Sie die Richtigkeit Ihrer Angaben. Vorsätzlich falsche Bestellungen, die einen Vermögensschaden verursachen, können als Betrug gemäß Artikel 236 des kroatischen Strafgesetzbuchs strafbar sein.",it:"Inviando l'ordine confermi l'esattezza dei dati. L'invio intenzionale di un ordine falso che causi un danno patrimoniale può costituire il reato di frode ai sensi dell'articolo 236 del Codice penale croato.",fr:"En envoyant la commande, vous confirmez l'exactitude de vos données. Passer volontairement une fausse commande causant un préjudice financier peut constituer le délit de fraude prévu à l'article 236 du Code pénal croate.",es:"Al enviar el pedido confirmas la exactitud de tus datos. Realizar un pedido falso de forma intencionada que cause un perjuicio patrimonial puede constituir el delito de fraude conforme al artículo 236 del Código Penal croata."},
"GREŠKA U NARUDŽBI":{en:"ORDER ERROR",de:"FEHLER BEI DER BESTELLUNG",it:"ERRORE NELL'ORDINE",fr:"ERREUR SUR LA COMMANDE",es:"ERROR EN EL PEDIDO"},
"Ako pogreškom naše kuhinje ili vozača dobijete pogrešno jelo, o trošku ćemo vam poslati zamjensko — pod uvjetom da nam vratite prvobitno jelo cijelo i netaknuto. Ako je jelo djelomično pojedeno, nažalost zamjenu ne možemo ponuditi.":{en:"If you receive the wrong dish due to a mistake by our kitchen or driver, we will send a replacement at our expense — provided you return the original dish whole and untouched. If the dish has been partially eaten, we unfortunately cannot offer a replacement.",de:"Falls Sie durch einen Fehler unserer Küche oder unseres Fahrers das falsche Gericht erhalten, senden wir Ihnen auf unsere Kosten ein Ersatzgericht — vorausgesetzt, Sie geben das ursprüngliche Gericht vollständig und unberührt zurück. Wurde das Gericht bereits teilweise gegessen, können wir leider keinen Ersatz anbieten.",it:"Se per un errore della nostra cucina o del fattorino ricevi il piatto sbagliato, te ne invieremo uno sostitutivo a nostre spese — a condizione che tu ci restituisca il piatto originale intero e intatto. Se il piatto è stato parzialmente consumato, purtroppo non possiamo offrire una sostituzione.",fr:"Si vous recevez le mauvais plat en raison d'une erreur de notre cuisine ou de notre livreur, nous vous enverrons un plat de remplacement à nos frais — à condition que vous nous rendiez le plat d'origine entier et intact. Si le plat a été partiellement consommé, nous ne pourrons malheureusement pas proposer de remplacement.",es:"Si recibes el plato equivocado por un error de nuestra cocina o del repartidor, te enviaremos uno de reemplazo a nuestro cargo — siempre que nos devuelvas el plato original entero e intacto. Si el plato se ha consumido parcialmente, lamentablemente no podremos ofrecer un reemplazo."},

"Ime, broj telefona i adresu koristimo isključivo radi izvršenja narudžbe i ne ustupamo ih trećim stranama.":{en:"We use your name, phone number, and address solely to fulfill your order and do not share them with third parties.",de:"Name, Telefonnummer und Adresse verwenden wir ausschließlich zur Ausführung der Bestellung und geben sie nicht an Dritte weiter.",it:"Utilizziamo nome, numero di telefono e indirizzo esclusivamente per evadere l'ordine e non li condividiamo con terzi.",fr:"Nous utilisons votre nom, numéro de téléphone et adresse uniquement pour exécuter la commande et ne les partageons pas avec des tiers.",es:"Usamos tu nombre, teléfono y dirección exclusivamente para completar el pedido y no los compartimos con terceros."},

"Vozač bira vozilo pri prijavi. Kad završi turu, prijeđeni kilometri (procjena iz rute) sami se zbroje na vozilo — tako se km i trošak goriva vode automatski, bez ručnog upisivanja.":{en:"The driver picks a vehicle when they log in. When they finish a tour, the distance driven (estimated from the route) is added to the vehicle automatically — so km and fuel cost are tracked without manual entry.",de:"Der Fahrer wählt bei der Anmeldung ein Fahrzeug. Nach Abschluss einer Tour werden die gefahrenen Kilometer (aus der Route geschätzt) automatisch zum Fahrzeug addiert — so werden km und Kraftstoffkosten ohne manuelle Eingabe erfasst.",it:"L'autista sceglie il veicolo al momento dell'accesso. Al termine di un giro, i chilometri percorsi (stimati dal percorso) si aggiungono automaticamente al veicolo — così km e costo del carburante si registrano senza inserimento manuale.",fr:"Le livreur choisit son véhicule à la connexion. À la fin d'une tournée, les kilomètres parcourus (estimés à partir de l'itinéraire) s'ajoutent automatiquement au véhicule — les km et le coût du carburant sont ainsi suivis sans saisie manuelle.",es:"El repartidor elige el vehículo al iniciar sesión. Al terminar una ruta, los kilómetros recorridos (estimados a partir de la ruta) se suman automáticamente al vehículo — así los km y el coste de combustible se registran sin introducción manual."},

"Obriši sve narudžbe i povijest":{en:"Delete all orders and history",de:"Alle Bestellungen und Verlauf löschen",it:"Elimina tutti gli ordini e la cronologia",fr:"Supprimer toutes les commandes et l'historique",es:"Eliminar todos los pedidos y el historial"},

"Ovo vraća SVE postavke (rok dostave, cijene, rezervu vremena, cijenu goriva i lozinke kuhinje/vlasnika) na tvorničke vrijednosti. Naziv, adresa, telefoni i jelovnik ostaju kako jesu. Jesi li siguran?":{en:"This resets ALL settings (delivery deadline, prices, time buffer, fuel price, and kitchen/owner passwords) to factory values. Name, address, phone numbers, and menu stay as they are. Are you sure?",de:"Dies setzt ALLE Einstellungen (Lieferfrist, Preise, Zeitpuffer, Kraftstoffpreis und Küchen-/Inhaberpasswörter) auf Werkswerte zurück. Name, Adresse, Telefonnummern und Speisekarte bleiben unverändert. Sind Sie sicher?",it:"Questo ripristina TUTTE le impostazioni (termine di consegna, prezzi, riserva di tempo, prezzo del carburante e password cucina/proprietario) ai valori di fabbrica. Nome, indirizzo, telefoni e menù restano invariati. Sei sicuro?",fr:"Cela réinitialise TOUS les paramètres (délai de livraison, prix, marge de temps, prix du carburant et mots de passe cuisine/propriétaire) aux valeurs d'usine. Le nom, l'adresse, les téléphones et le menu restent inchangés. Êtes-vous sûr ?",es:"Esto restablece TODOS los ajustes (plazo de entrega, precios, margen de tiempo, precio del combustible y contraseñas de cocina/propietario) a los valores de fábrica. El nombre, la dirección, los teléfonos y el menú permanecen igual. ¿Estás seguro?"},

"Postavke su vraćene na tvorničke.":{en:"Settings have been reset to factory values.",de:"Die Einstellungen wurden auf die Werkswerte zurückgesetzt.",it:"Le impostazioni sono state ripristinate ai valori di fabbrica.",fr:"Les paramètres ont été réinitialisés aux valeurs d'usine.",es:"Los ajustes se han restablecido a los valores de fábrica."},
"OVO TRAJNO BRIŠE sve narudžbe (nove, u pripremi, spremne, u dostavi), cijelu povijest narudžbi, sve ture/vožnje i program vjernosti (bodove svih kupaca). NE MOŽE se vratiti. Jesi li potpuno siguran?":{en:"This PERMANENTLY DELETES all orders (new, in preparation, ready, out for delivery), the entire order history, all tours/deliveries, and the loyalty program (all customers' points). This CANNOT be undone. Are you completely sure?",de:"Dies LÖSCHT DAUERHAFT alle Bestellungen (neu, in Zubereitung, fertig, in Zustellung), den gesamten Bestellverlauf, alle Touren/Fahrten und das Treueprogramm (Punkte aller Kunden). Dies kann NICHT rückgängig gemacht werden. Sind Sie sich vollkommen sicher?",it:"Questo ELIMINA DEFINITIVAMENTE tutti gli ordini (nuovi, in preparazione, pronti, in consegna), l'intera cronologia ordini, tutti i giri/consegne e il programma fedeltà (i punti di tutti i clienti). Questo NON può essere annullato. Sei assolutamente sicuro?",fr:"Cela SUPPRIME DÉFINITIVEMENT toutes les commandes (nouvelles, en préparation, prêtes, en livraison), tout l'historique des commandes, toutes les tournées/livraisons et le programme de fidélité (points de tous les clients). Ceci NE PEUT PAS être annulé. Êtes-vous absolument sûr ?",es:"Esto ELIMINA PERMANENTEMENTE todos los pedidos (nuevos, en preparación, listos, en reparto), todo el historial de pedidos, todas las rutas/entregas y el programa de fidelidad (puntos de todos los clientes). Esto NO se puede deshacer. ¿Estás completamente seguro?"},

function prevediTekst(s){
 if(LANG==="hr"||!s)return s;
 const norm=s.replace(/\s+/g," ").trim();
 if(!norm)return s;
 const i=s.indexOf(norm.slice(0,1));
 const lead=i>0?s.slice(0,i):(s.match(/^\s*/)||[""])[0];
 const trail=(s.match(/\s*$/)||[""])[0];
 const t=PRIJEVODI[norm];
 if(t&&t[LANG])return lead+t[LANG]+trail;
 for(const [re,map] of PRIJEVODI_UZORAK){
  const m=norm.match(re);
  if(m&&map[LANG]){
   const tpl=map[LANG].replace(/\{(\d+)\}/g,(_,n)=>m[+n]!==undefined?m[+n]:"");
   return lead+tpl+trail;}}
 return s;}
function tj(s){return prevediTekst(s);}
function prevediCvor(koren){
 if(!koren||LANG==="hr")return;
 const hod=document.createTreeWalker(koren,NodeFilter.SHOW_TEXT,null);
 const cvorovi=[]; let n;
 while(n=hod.nextNode())cvorovi.push(n);
 cvorovi.forEach(cv=>{const t=prevediTekst(cv.nodeValue); if(t!==cv.nodeValue)cv.nodeValue=t;});
 koren.querySelectorAll("[placeholder],[title],[aria-label]").forEach(e=>{
  ["placeholder","title","aria-label"].forEach(a=>{
   if(e.hasAttribute(a)){const v=e.getAttribute(a),t=prevediTekst(v); if(t!==v)e.setAttribute(a,t);}});});}
function prevediApp(){if(LANG!=="hr")prevediCvor(document.body);}

function upaliZvuk(){

  if(!audioEl){audioEl=document.createElement("audio");
   audioEl.setAttribute("playsinline","");audioEl.preload="auto";
   document.body.appendChild(audioEl);}
  audioEl.volume=Math.max(.05,Math.min(1,ZV.glasnoca));
  if(ZV.budno)drziBudno(true);
  audioEl.src=nadjiZvuk(ZV.narudzba).src;

    zvukPoruka="";crtaj(1);})
   .catch(e=>{zvukPoruka="Preglednik je odbio zvuk: "+(e.name||e);crtaj(1);});
  else{zvukOK=true;ZV.ukljucen=true;spremiZvuk();crtaj(1);}
 }catch(e){zvukPoruka="Greška: "+(e.message||e);crtaj(1);}}

function km(a,b){if(!a||!b||!a.lat||!b.lat)return 0;
 const R=6371,r=Math.PI/180,dA=(b.lat-a.lat)*r,dO=(b.lng-a.lng)*r;
 const x=Math.sin(dA/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dO/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));}
function azimut(o,d){const r=Math.PI/180;
 const y=Math.sin((d.lng-o.lng)*r)*Math.cos(d.lat*r);
 const x=Math.cos(o.lat*r)*Math.sin(d.lat*r)-Math.sin(o.lat*r)*Math.cos(d.lat*r)*Math.cos((d.lng-o.lng)*r);
 return (Math.atan2(y,x)*180/Math.PI+360)%360;}
const razKut=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};

 /* Naknada za dostavu iznad praga km privremeno je isključena na korisnikov zahtjev —

 return 0;}
function racun(k){
 const pizze=k.filter(s=>!s.gratis&&(jelo(s.jeloId).kategorija.includes("pizze")||jelo(s.jeloId).kategorija==="Calzone"))
   .map(s=>+jelo(s.jeloId).cijena+s.dodaci.reduce((t,i)=>t+ +dod(i).cijena,0)).sort((a,b)=>a-b);
 const puno=k.reduce((t,s)=>t+cijenaStavke(s),0);
 const gp=Math.floor(pizze.length/5);
 const popust=pizze.slice(0,gp).reduce((t,c)=>t+c,0);
 const loj=k.filter(s=>s.gratis).reduce((t,s)=>t+ +jelo(s.jeloId).cijena,0);
 // koje su tocno stavke gratis po akciji 4+1
 const kandidati=k.map((s,i)=>({i,c:+jelo(s.jeloId).cijena+s.dodaci.reduce((t,x)=>t+ +dod(x).cijena,0),
   pizza:!s.gratis&&(jelo(s.jeloId).kategorija.includes("pizze")||jelo(s.jeloId).kategorija==="Calzone")}))
  .filter(x=>x.pizza).sort((a,b)=>a.c-b.c);
 const gratisIdx=kandidati.slice(0,gp).map(x=>x.i);
 const dost=cijenaDostave();
 return {puno,popust,lojalnost:loj,dostava:dost,bezDostave:puno-popust,

     Prije se čekalo redom: vozači → vozila → (geokodiranje) → osvjezi() (još 4 upita zaredom)
     i TEK ONDA se crtalo — dakle gost je gledao prazan ekran kroz ~9 uzastopnih odlazaka do

   const osvjezavanjeGosta = (uloga==="gost") ? osvjezi() : null;

/* ---- Realtime veza: praćenje statusa + automatski oporavak ----
   Prije je kanal bio samo jednom pretplaćen bez provjere je li spajanje uspjelo.
   Ako bi se WebSocket prekinuo (npr. baza se "budi" nakon neaktivnosti, slaba mreža),
   ništa se nije automatski ponovno spajalo — kuhinja bi ostala na "spajam se" ili na
   naizgled uspješnoj vezi koja zapravo ne prima nove narudžbe dok se ručno ne refresha. */
let realtimeKanal=null, realtimePokusaj=0, realtimeTajmer=null;
function pokreniRealtime(){
 if(realtimeKanal){try{sb.removeChannel(realtimeKanal)}catch(e){}}
 clearTimeout(realtimeTajmer);
 realtimeKanal=sb.channel("sve-"+Date.now())
  .on("postgres_changes",{event:"*",schema:"public",table:"narudzbe"},()=>{
    osvjezi(); setTimeout(osvjezi,1500); setTimeout(osvjezi,4000);})
  .on("postgres_changes",{event:"*",schema:"public",table:"ture"},osvjezi)
  .on("postgres_changes",{event:"*",schema:"public",table:"poruke"},osvjezi)
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"lokali",filter:"id=eq."+lokal.id},payload=>{
    if(payload.new)Object.assign(lokal,payload.new); crtaj(1);})
  .subscribe(status=>{
   if(status==="SUBSCRIBED"){realtimePokusaj=0; veza("ok","uživo"); setTimeout(()=>{const v=el("veza");if(v)v.style.display="none";},1200);}
   else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
    veza("lose","spajam ponovno…");
    const cekanje=Math.min(15000,1500*Math.pow(2,realtimePokusaj++));
    clearTimeout(realtimeTajmer);
    realtimeTajmer=setTimeout(()=>{pokreniRealtime(); osvjezi();},cekanje);}});}
/* Sigurnosna mreža: i kad bi realtime veza tiho zapela, ekran se svejedno redovito
   osvježava sam od sebe — kuhinja/vozač neće ostati "zaglavljeni" bez nove narudžbe
   na ekranu dok netko ne refresha ručno. Bitno kod većeg prometa i više uređaja odjednom. */
function pokreniSigurnosnoOsvjezavanje(){
 setInterval(()=>{if(document.visibilityState==="visible")osvjezi();},20000);}

async function osvjezi(){
 if(!sb||!lokal)return;
 const prijeNovihId=new Set(narudzbe.filter(o=>o.stanje==="novo").map(o=>o.id));
 const prijeNovih=prijeNovihId.size;
 const prijeSpremnih=narudzbe.filter(o=>o.stanje==="spremno").length;
 /* Sva četiri upita idu ISTOVREMENO (prije su išla jedan za drugim, pa je svako osvježavanje
    ekrana čekalo četiri puna odlaska do baze umjesto jednog). Prvi je sigurnosna mreža za
    pauzu narudžbi, za slučaj da realtime poruka o promjeni lokala promakne. */
 const [lk,n,t,p]=await Promise.all([
  sb.from("lokali").select("narudzbe_pauza_do").eq("id",lokal.id).single(),
  sb.from("narudzbe").select("*, stavke(*)").eq("lokal_id",lokal.id)
   .in("stanje",["novo","u_pripremi","spremno","u_dostavi","otkazano"]).order("stvoreno"),
  sb.from("ture").select("*").eq("lokal_id",lokal.id).neq("stanje","zavrsena"),
  sb.from("poruke").select("*").eq("lokal_id",lokal.id).order("stvoreno")]);
 if(!lk.error&&lk.data)lokal.narudzbe_pauza_do=lk.data.narudzbe_pauza_do;
 if(!n.error)narudzbe=n.data;
 // nova narudžba mora odmah biti VIDLJIVO OTVORENA u kuhinji — inače je kartica zbijena
 // i gumb "Prihvati" fizički ne postoji na ekranu dok ga netko ručno ne otvori (pravi uzrok
 // pritužbe "kliknuo sam Prihvati i ništa se nije dogodilo": gumb jednostavno nije bio prikazan).
 narudzbe.filter(o=>o.stanje==="novo"&&!prijeNovihId.has(o.id)).forEach(o=>otvorene.add(o.id));
 if(zvukOK){
  if(uloga==="kuhinja"&&narudzbe.filter(o=>o.stanje==="novo").length>prijeNovih)odsviraj("narudzba");
  if(uloga==="vozac"&&narudzbe.filter(o=>o.stanje==="spremno").length>prijeSpremnih)odsviraj("tura");}
 if(!t.error)ture=t.data;
 if(!p.error){
  const prijeId=new Set(poruke.map(x=>x.id));
  const nove=p.data.filter(x=>!prijeId.has(x.id));
  poruke=p.data;
  if(zvukOK&&nove.length){
   if(uloga==="kuhinja"&&nove.some(x=>x.od==="gost"))odsviraj("poruka");
   if(uloga==="gost"&&mojaId&&nove.some(x=>x.od==="kuhinja"&&x.narudzba_id===mojaId))odsviraj("poruka");}}
 if(uloga!=="gost"){
  const h=await sb.from("narudzbe").select("telefon,vozac,placanje,iznos,stvoreno")
   .eq("lokal_id",lokal.id).eq("stanje","dostavljeno");

   h.data.forEach(x=>{const t=String(x.telefon).replace(/\D/g,"");
    brojac_kupaca[t]=(brojac_kupaca[t]||0)+1;});}}
 if(kupac){const k=await sb.from("kupci").select("*").eq("lokal_id",lokal.id)
   .eq("tel",kupac.tel).maybeSingle(); if(k.data)kupac=k.data;}
 crtaj();}

function vezDodatke(){

   +[...document.querySelectorAll(`[data-d="${id}"]:checked`)].reduce((t,x)=>t+ +dod(x.value).cijena,0)
   +[...document.querySelectorAll(`[data-u="${id}"]:checked`)].reduce((t,x)=>t+ +jelo(x.value).cijena,0);
  const c=el("c-"+id); if(c)c.textContent=eur(s);}));}

 otvoreno=otvoreno===id?null:id;crtaj();

/* Google Geocoding — najbolji izvor za zagrebačke adrese (uključuje kućne brojeve
   koje Nominatim/Geoapify znaju promašiti). Traži samo unutar okvira oko lokala
   da ne vuče rezultate iz drugih gradova pod istim imenom ulice. */
async function nadiGoogle(q){
 const g=gcoder(); if(!g)return [];
 const {ulica,broj}=razlomiAdresu(q);
 if(!ulica)return [];
 const tekst=(broj?broj+" ":"")+ulica+", Zagreb, Hrvatska";
 return new Promise(resolve=>{
  try{
   g.geocode({address:tekst,componentRestrictions:{country:"HR"},
     bounds:new google.maps.LatLngBounds(
      {lat:(lokal.lat||45.8)-0.12,lng:(lokal.lng||15.98)-0.18},
      {lat:(lokal.lat||45.8)+0.12,lng:(lokal.lng||15.98)+0.18})},
    (rez,status)=>{
     if(status!=="OK"||!rez||!rez.length){resolve([]);return;}
     const svi=rez.map(x=>{
      const ac=x.address_components||[];
      const nadji=t=>{const c=ac.find(c=>c.types.includes(t));return c?c.long_name:"";};
      const ulicaN=nadji("route")||ulica;
      const brojN=nadji("street_number");
      const naselje=nadji("sublocality")||nadji("sublocality_level_1")||nadji("neighborhood")||"";
      return {lat:x.geometry.location.lat(),lng:x.geometry.location.lng(),
       adresa:(ulicaN+(brojN?" "+brojN:"")).trim(),
       naselje, tocanBroj:!!brojN,
       opis:(ulicaN+(brojN?" "+brojN:"")).trim()+(naselje?" — "+naselje:"")};});
     resolve(svi);});
  }catch(e){resolve([]);}});}
async function nadiGeoapify(q){
 if(!GEOAPIFY_KEY)return [];
 const {ulica,broj}=razlomiAdresu(q);
 if(!ulica)return [];
 const tekst=(broj?broj+" ":"")+ulica+", Zagreb, Hrvatska";
 try{
  const u="https://api.geoapify.com/v1/geocode/search?text="+encodeURIComponent(tekst)
   +"&filter=countrycode:hr&bias=proximity:"+lokal.lng+","+lokal.lat
   +"&limit=5&format=json&apiKey="+GEOAPIFY_KEY;
  const r=await fetch(u);
  const d=await r.json();
  if(!d||!d.results||!d.results.length)return [];
  const svi=d.results.map(x=>({
   lat:x.lat, lng:x.lon,
   adresa:((x.street||x.name||ulica)+(x.housenumber?" "+x.housenumber:"")).trim(),
   naselje:(x.suburb||x.district||x.city_district||"").trim(),
   tocanBroj:!!x.housenumber,
   opis:((x.street||x.name||ulica)+(x.housenumber?" "+x.housenumber:"")).trim()
    +(x.suburb?" — "+x.suburb:"")}));
  if(broj){const tocni=svi.filter(x=>x.tocanBroj &&
    String(x.adresa.match(/\d+[a-zA-Z]?$/)||"").toLowerCase()===broj.toLowerCase());
   if(tocni.length)return tocni;}
  return svi;
 }catch(e){return [];}}
async function nadiStrukturirano(q){
 const {ulica,broj}=razlomiAdresu(q);
 if(!ulica)return [];
 const varijante=[ulica, bezKvacica(ulica)];
 for(const u of [...new Set(varijante)]){
  const p=new URLSearchParams({format:"json",limit:"6",addressdetails:"1",
    countrycodes:"hr",city:"Zagreb",street:(broj?broj+" ":"")+u});
  try{
   const r=await fetch("https://nominatim.openstreetmap.org/search?"+p.toString(),
     {headers:{"Accept-Language":"hr"}});
   const d=await r.json();
   if(d&&d.length){
    const tocni=broj?d.filter(x=>x.address&&String(x.address.house_number||"")
      .toLowerCase()===broj.toLowerCase()):[];
    return (tocni.length?tocni:d).map(pretvori);}
  }catch(e){}}
 return [];}
function pretvori(x){
 const ad=x.address||{};
 const ulica=(ad.road||x.name||x.display_name.split(",")[0]||"").trim();
 const broj=(ad.house_number||"").trim();
 const kv=(ad.suburb||ad.city_district||ad.neighbourhood||ad.quarter||"")
   .replace(/^Gradska četvrt\s*/i,"").trim();
 return {lat:+x.lat,lng:+x.lon,adresa:(ulica+(broj?" "+broj:"")).trim(),naselje:kv,
   tocanBroj:!!broj,opis:(ulica+(broj?" "+broj:"")).trim()+(kv?" — "+kv:"")};}
async function nadiAdrese(q){
 // Google Geocoding prvi na redu — najpouzdaniji za tocne kucne brojeve u Zagrebu
 const gog=await nadiGoogle(q);
 const tocanGog=gog.find(x=>x.tocanBroj);
 if(tocanGog)return [tocanGog,...gog.filter(x=>x!==tocanGog)];
 const str=await nadiStrukturirano(q);
 const tocanStr=str.find(x=>x.tocanBroj);
 if(tocanStr)return [tocanStr,...str.filter(x=>x!==tocanStr)];
 // Nominatim nije nasao tocan kucni broj — probaj Geoapify prije nego odustanemo
 const geo=await nadiGeoapify(q);
 const tocanGeo=geo.find(x=>x.tocanBroj);
 if(tocanGeo)return [tocanGeo,...geo.filter(x=>x!==tocanGeo)];
 if(gog.length)return gog;
 if(str.length)return str;
 if(geo.length)return geo;
 const upiti=[q, bezKvacica(q)];
 for(const u of [...new Set(upiti)]){
  try{
   const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=hr&addressdetails=1&q="
     +encodeURIComponent(u+", Zagreb"),{headers:{"Accept-Language":"hr"}});
   const d=await r.json();
   if(d&&d.length){
    const trazeniBroj=(u.match(/\b(\d+[a-zA-Z]?)\b/)||[])[1];
    if(trazeniBroj){
     const tocni=d.filter(x=>x.address&&String(x.address.house_number||"")
       .toLowerCase()===trazeniBroj.toLowerCase());
     if(tocni.length)d=tocni;}
   }
   if(d&&d.length)return d.map(x=>{
    const ad=x.address||{};
    const ulica=(ad.road||x.name||x.display_name.split(",")[0]||"").trim();
    const broj=(ad.house_number||"").trim();
    const kv=(ad.suburb||ad.city_district||ad.neighbourhood||ad.quarter||"")
      .replace(/^Gradska četvrt\s*/i,"").trim();
    return {lat:+x.lat,lng:+x.lon,
      adresa:(ulica+(broj?" "+broj:"")).trim(),
      naselje:kv,
      opis:(ulica+(broj?" "+broj:"")).trim()+(kv?" — "+kv:"")};});
  }catch(e){}}
 return [];}

function vlAnaliza(){
 const dost=vlPovijest.filter(o=>o.stanje==="dostavljeno");
 const otk=vlPovijest.filter(o=>o.stanje==="otkazano");
 const promet=dost.reduce((s,o)=>s+ +o.iznos,0);
 const kes=dost.filter(o=>o.placanje==="gotovina").reduce((s,o)=>s+ +o.iznos,0);
 const artikli={},poVozacu={},poDanu={};
 let trosakNam=0, pokriveno=0, ukupnoStavki=0;
 dost.forEach(o=>{
  (o.stavke||[]).forEach(x=>{
   const k=x.naziv; artikli[k]=artikli[k]||{kom:0,eur:0};
   artikli[k].kom++; artikli[k].eur+= +x.cijena;
   ukupnoStavki++;
   const j=jela.find(y=>y.naziv===x.naziv);
   const c=j?trosakJela(j.id):null;
   if(c!==null){trosakNam+=c;pokriveno++;}});
  const v=o.vozac||"—"; poVozacu[v]=poVozacu[v]||{n:0,eur:0,kes:0};
  poVozacu[v].n++; poVozacu[v].eur+= +o.iznos;
  if(o.placanje==="gotovina")poVozacu[v].kes+= +o.iznos;
  const d=String(o.stvoreno).slice(0,10); poDanu[d]=(poDanu[d]||0)+ +o.iznos;});
 const poNorm=pokriveno>ukupnoStavki*0.5;
 const namTrosak=poNorm?trosakNam:promet*((lokal.trosak_posto||32)/100);
 return {dost,otk,promet,kes,kar:promet-kes,artikli,poVozacu,poDanu,
   namTrosak,poNorm,pokriveno,ukupnoStavki};}

 const pod={...iz}; if(pod.cijena!==undefined)pod.cijena=parseFloat((pod.cijena+"").replace(",","."))||0;
 const stari=jela.find(x=>x.id===id);
 if(stari)Object.keys(pod).forEach(k=>zabiljeziIzmjenu("jela",id,k,stari[k]));
 const r=await sb.from("jela").update(pod).eq("id",id);
 if(r.error){alert("Greška: "+r.error.message);return;}
 delete izmjene[id]; await ucitajJela();}

function snimiPozicije(elovi){
 const m=new Map(); elovi.forEach(el=>m.set(el,el.getBoundingClientRect())); return m;}
function primijeniFlip(elovi,prije){
 elovi.forEach(el=>{
  const staro=prije.get(el); if(!staro)return;
  const novo=el.getBoundingClientRect();
  const dx=staro.left-novo.left, dy=staro.top-novo.top;
  if(dx||dy){
   el.style.transition="none"; el.style.transform=`translate(${dx}px,${dy}px)`;
   requestAnimationFrame(()=>{el.style.transition="transform .18s ease"; el.style.transform="";});}});}
function dragOverGeneric(e,cont,vuceniNode){
 if(!vuceniNode)return;
 const sibs=[...cont.children].filter(c=>c!==vuceniNode);
 let posle=null;
 for(const sib of sibs){
  const r=sib.getBoundingClientRect();
  if(e.clientY<r.top+r.height/2){posle=sib;break;}}
 if(vuceniNode.parentElement===cont&&vuceniNode.nextElementSibling===posle)return;
 const prije=snimiPozicije(sibs);
 if(posle)cont.insertBefore(vuceniNode,posle); else cont.appendChild(vuceniNode);
 primijeniFlip(sibs,prije);}
function dragOverLista(e){e.preventDefault(); if(vucem&&vuceniEl)dragOverGeneric(e,e.currentTarget,vuceniEl);}
function dragOverKat(e){e.preventDefault(); if(vucemKat&&vuceniKatEl)dragOverGeneric(e,e.currentTarget,vuceniKatEl);}
async function primijeniRedoslijedIzDOMa(){
 const blokovi=[...document.querySelectorAll(".kat-sve .kat-blok")];
 if(!blokovi.length)return;
 const azuriranja=[]; let red=1;
 for(const blok of blokovi){
  const kat=blok.getAttribute("data-kat");
  const stavke=[...blok.querySelectorAll(".kat-lista .ord")];
  for(const el of stavke){
   const id=el.getAttribute("data-id"), j=jela.find(x=>x.id===id);
   if(j&&(j.redoslijed!==red||j.kategorija!==kat))azuriranja.push({id,redoslijed:red,kategorija:kat});
   red++;}}
 if(!azuriranja.length)return;
 azuriranja.forEach(a=>{const j=jela.find(x=>x.id===a.id); if(j){j.redoslijed=a.redoslijed;j.kategorija=a.kategorija;}});
 await Promise.all(azuriranja.map(a=>sb.from("jela").update({redoslijed:a.redoslijed,kategorija:a.kategorija}).eq("id",a.id)));
 await ucitajJela();}

async function pomakniKat(ki,smjer){
 const kats=[...new Set(jela.map(j=>j.kategorija))];
 const n=ki+smjer; if(n<0||n>=kats.length)return;
 const a=jela.filter(j=>j.kategorija===kats[ki]), b=jela.filter(j=>j.kategorija===kats[n]);
 const minA=Math.min(...a.map(j=>j.redoslijed)), minB=Math.min(...b.map(j=>j.redoslijed));
 const raz=minB-minA;
 for(const j of a) await sb.from("jela").update({redoslijed:j.redoslijed+raz}).eq("id",j.id);
 for(const j of b) await sb.from("jela").update({redoslijed:j.redoslijed-raz}).eq("id",j.id);
 await ucitajJela();}
async function ucitajJela(){
 const j=await sb.from("jela").select("*").eq("lokal_id",lokal.id).order("redoslijed");
 if(!j.error)jela=j.data;
 crtaj(1);}

function smanjiSliku(file,cb){
 const fr=new FileReader();
 fr.onload=e=>{const im=new Image();
  im.onload=()=>{
   const c=document.createElement("canvas");
   const s=Math.min(1,520/Math.max(im.width,im.height));
   c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   cb(c.toDataURL("image/jpeg",0.78));};
  im.src=e.target.result;};
 fr.readAsDataURL(file);}

  if(r.error){alert("Greška: "+r.error.message);return;}
  await ucitajJela();});}

  const pod={}; pod[polje]=polje==="kolicina"?(parseFloat((v+"").replace(",","."))||0):v;

   const m=nam(v); if(m&&+m.zadana_kolicina>0)pod.kolicina=+m.zadana_kolicina;}

  const i=normativi.findIndex(x=>x.id===id); if(i>=0)normativi[i]={...normativi[i],...pod};

 if(polje==="namirnica_id")zavrsi(); else{normTajmer[id+polje]=setTimeout(zavrsi,500);}}

let trTajmer={};
function spremiTrosak(id,polje,v){
 clearTimeout(trTajmer[id+polje]);
 trTajmer[id+polje]=setTimeout(async()=>{
  const pod={}; pod[polje]=polje==="iznos"?(parseFloat((v+"").replace(",","."))||0):v;
  const stari=troskovi.find(x=>x.id===id);
  if(stari)zabiljeziIzmjenu("troskovi",id,polje,stari[polje]);
  await sb.from("troskovi").update(pod).eq("id",id);
  const i=troskovi.findIndex(x=>x.id===id); if(i>=0)troskovi[i]={...troskovi[i],...pod};
  crtaj(1);
 },500);}
async function dodajTrosak(n){
 const r=await sb.from("troskovi").insert({lokal_id:lokal.id,mjesec:trMjesec,naziv:n,
   iznos:0,vrsta:"racun",placeno:false}).select().single();
 if(!r.error)troskovi.push(r.data); crtaj(1);}
async function obrisiTrosak(id){
 const x=troskovi.find(t=>t.id===id); if(!x)return;
 if(x.vrsta==="fiksni"){
  if(!confirm('"'+x.naziv+'" je fiksni trošak koji se sam upisuje svaki mjesec. Obrisati ga trajno, iz ovog i svih budućih mjeseci?'))return;
  await sb.from("fiksni_troskovi").delete().eq("id",x.izvor_id);
  fiksni=fiksni.filter(f=>f.id!==x.izvor_id);
 } else if(x.vrsta==="placa"){
  if(!confirm('"'+x.naziv+'" je plaća zaposlenika. Obrisati zaposlenika trajno, iz ovog i svih budućih mjeseci?'))return;
  await sb.from("zaposlenici").delete().eq("id",x.izvor_id);
  zaposlenici=zaposlenici.filter(z=>z.id!==x.izvor_id);
 } else {
  if(!confirm("Obrisati ovaj trošak?"))return;
 }
 await sb.from("troskovi").delete().eq("id",id);
 troskovi=troskovi.filter(t=>t.id!==id); crtaj(1);}

let zapTajmer={};
function spremiZaposlenika(id,polje,v){
 if(polje==="aktivan"){
  sb.from("zaposlenici").update({aktivan:v}).eq("id",id);
  const i=zaposlenici.findIndex(x=>x.id===id); if(i>=0)zaposlenici[i].aktivan=v; crtaj(1); return;}
 clearTimeout(zapTajmer[id+polje]);
 zapTajmer[id+polje]=setTimeout(async()=>{
  const pod={}; pod[polje]=["placa_bruto","placa_neto"].includes(polje)?(parseFloat((v+"").replace(",","."))||0):v;
  const stari=zaposlenici.find(x=>x.id===id);
  if(stari)zabiljeziIzmjenu("zaposlenici",id,polje,stari[polje]);
  if(polje==="placa_bruto"||polje==="placa_neto"){
   const trenutni={...stari,...pod};
   pod.doprinosi=Math.max(0,(+trenutni.placa_bruto||0)-(+trenutni.placa_neto||0));}
  await sb.from("zaposlenici").update(pod).eq("id",id);
  const i=zaposlenici.findIndex(x=>x.id===id); if(i>=0)zaposlenici[i]={...zaposlenici[i],...pod};
  crtaj(1);
 },polje==="pozicija"?400:600);}
async function noviZaposlenik(){
 const ime=prompt("Ime i prezime zaposlenika:"); if(!ime)return;
 const bruto=parseFloat((prompt("Bruto plaća mjesečno (trošak tvrtke):","1000")||"0").replace(",","."))||0;
 const neto=parseFloat((prompt("Neto plaća (što zaposlenik dobije na ruke):","750")||"0").replace(",","."))||0;
 const r=await sb.from("zaposlenici").insert({lokal_id:lokal.id,ime,placa_bruto:bruto,
   placa_neto:neto,doprinosi:Math.max(0,bruto-neto),aktivan:true}).select().single();
 if(!r.error)zaposlenici.push(r.data); crtaj(1);}
async function obrisiZaposlenika(id,ime){
 if(!confirm("Obrisati zaposlenika "+ime+"? Povijest plaćenih troškova ostaje sačuvana.")) return;
 await sb.from("zaposlenici").delete().eq("id",id);
 zaposlenici=zaposlenici.filter(x=>x.id!==id);
 const t=troskovi.find(x=>x.izvor_id===id&&x.mjesec===trMjesec);
 if(t){await sb.from("troskovi").delete().eq("id",t.id); troskovi=troskovi.filter(x=>x.id!==t.id);}
 crtaj(1);}
async function obrisiFiksni(id){
 if(!confirm("Obrisati fiksni trošak?"))return;
 await sb.from("fiksni_troskovi").delete().eq("id",id);
 fiksni=fiksni.filter(x=>x.id!==id);
 const t=troskovi.find(x=>x.izvor_id===id&&x.mjesec===trMjesec);
 if(t){await sb.from("troskovi").delete().eq("id",t.id); troskovi=troskovi.filter(x=>x.id!==t.id);}
 crtaj(1);}

 const polje=(k,n,tip)=>`<label class="f">${n}</label>
  <input class="f" id="pl-${k}" ${tip||""} value="${esc(p(k))}" oninput="mijenjajLokal('${k}',this.value)">`;
 return `<div class="sec"><h3>PODACI LOKALA</h3></div>
 <div class="box">${polje("naziv","Naziv")}${polje("adresa","Adresa")}
  ${polje("tel1","Telefon 1")}${polje("tel2","Telefon 2")}</div>
 <div class="sec"><h3>NASLOVNA FOTOGRAFIJA</h3></div>
 <div class="box">
  ${lokal.naslovna_url?`<img src="${lokal.naslovna_url}" style="width:100%;border-radius:9px;margin-bottom:10px">`
   :`<p class="savjet">Trenutno se koristi zadana fotografija peći.</p>`}
  <input type="file" accept="image/*" id="nasl" style="display:none" onchange="ucitajNaslovnu(this)">
  <button class="btn ghost" onclick="el('nasl').click()">Odaberi fotografiju</button>
  ${lokal.naslovna_url?`<button class="btn tiho" onclick="makniNaslovnu()">Vrati zadanu</button>`:""}
  <p class="savjet">Fotografija se automatski zatamni i stavi iza teksta, kao sada.</p></div>
 <div class="sec"><h3>DOSTAVA I VRIJEME</h3></div>
 <div class="box">
  <p class="savjet" style="margin-top:0">Naknada za dostavu je trenutno isključena — dostava je besplatna na svim udaljenostima. Ova dva polja ostaju spremljena za kasnije, ali se sad ne primjenjuju.</p>
  ${polje("dostava_prag_km","Besplatna dostava do (km) — neaktivno","type=number step=0.5")}
  ${polje("dostava_cijena","Naknada za dostavu (€) — neaktivno","type=number step=0.5")}
  ${polje("rezerva","Skrivena rezerva (min)","type=number")}
  ${polje("brzina","Prosječna brzina (km/h)","type=number")}
  ${polje("rok_vracanja","Rok za vraćanje narudžbe (min)","type=number")}
  ${polje("trosak_posto","Procjena troška namirnica (%)","type=number")}</div>
 <div class="sec"><h3>GORIVO</h3></div>
 <div class="box">${polje("cijena_benzin","Cijena benzina (€/l)","type=number step=0.01")}
  ${polje("cijena_dizel","Cijena dizela (€/l)","type=number step=0.01")}
  <p class="savjet">Koristi se za izračun troška goriva po vozilu u kartici Vozni park.</p></div>
 <div class="sec"><h3>LOZINKE</h3></div>
 <div class="box">${polje("loz_kuhinja","Lozinka kuhinje")}${polje("loz_vlasnik","Lozinka vlasnika")}
  <p class="savjet">PIN-ove vozača mijenjaš u kartici Vozači.</p></div>
 <div style="padding:0 18px 26px">

 <div class="box" style="border:1px solid var(--red)">

  <p class="savjet" style="margin:-4px 0 14px">Vraća dostavu, rezervu, cijene goriva i lozinke (kuhinja/vlasnik) na početne vrijednosti. Naziv, adresa, telefoni i jelovnik ostaju netaknuti.</p>

  <p class="savjet" style="margin:-4px 0 0">Trajno briše sve narudžbe (nove, u pripremi, u dostavi), cijelu povijest, sve ture/vožnje i program vjernosti. Koristi se npr. kod predaje pizzerije novom vlasniku.</p></div>`;}
function mijenjajLokal(k,v){izmjene.lokal=izmjene.lokal||{};izmjene.lokal[k]=v;crtaj(1);}
async function spremiLokal(){
 const pod={...izmjene.lokal};
 ["dostava_prag_km","dostava_cijena","rezerva","brzina","rok_vracanja","trosak_posto","cijena_benzin","cijena_dizel"]
  .forEach(k=>{if(pod[k]!==undefined)pod[k]=parseFloat((pod[k]+"").replace(",","."))||0;});
 Object.keys(pod).forEach(k=>zabiljeziIzmjenu("lokali",lokal.id,k,lokal[k]));
 const r=await sb.from("lokali").update(pod).eq("id",lokal.id);
 if(r.error){alert("Greška: "+r.error.message);return;}
 Object.assign(lokal,pod); delete izmjene.lokal; crtaj(1);}
async function makniNaslovnu(){
 await sb.from("lokali").update({naslovna_url:null}).eq("id",lokal.id);
 lokal.naslovna_url=null; crtaj(1);}
async function resetTvornicki(){
 if(!confirm(tj("Ovo vraća SVE postavke (rok dostave, cijene, rezervu vremena, cijenu goriva i lozinke kuhinje/vlasnika) na tvorničke vrijednosti. Naziv, adresa, telefoni i jelovnik ostaju kako jesu. Jesi li siguran?")))return;
 const pin=prompt(tj("Za potvrdu upiši PIN vlasnika:"));
 if(pin===null)return;
 if(pin!==LOZ_VLASNIK()){alert(tj("Pogrešan PIN. Ništa nije promijenjeno."));return;}
 const zad={dostava_prag_km:3,dostava_cijena:2,rezerva:5,brzina:23,rok_vracanja:7,trosak_posto:32,
   cijena_benzin:1.45,cijena_dizel:1.40,loz_kuhinja:"1234",loz_vlasnik:"9999"};
 const r=await sb.from("lokali").update(zad).eq("id",lokal.id);
 if(r.error){alert(tj("Greška: ")+r.error.message);return;}
 Object.assign(lokal,zad); izmjene.lokal={};
 alert(tj("Postavke su vraćene na tvorničke."));
 crtaj(1);}
async function resetPovijest(){
 if(!confirm(tj("OVO TRAJNO BRIŠE sve narudžbe (nove, u pripremi, spremne, u dostavi), cijelu povijest narudžbi, sve ture/vožnje i program vjernosti (bodove svih kupaca). NE MOŽE se vratiti. Jesi li potpuno siguran?")))return;
 const pin=prompt(tj("Za potvrdu upiši PIN vlasnika:"));
 if(pin===null)return;
 if(pin!==LOZ_VLASNIK()){alert(tj("Pogrešan PIN. Ništa nije obrisano."));return;}
 let r=await sb.from("narudzbe").delete().eq("lokal_id",lokal.id);
 if(r.error){alert(tj("Greška (narudžbe): ")+r.error.message);return;}
 r=await sb.from("ture").delete().eq("lokal_id",lokal.id);
 if(r.error){alert(tj("Greška (ture): ")+r.error.message);return;}
 r=await sb.from("kupci").delete().eq("lokal_id",lokal.id);
 if(r.error){alert(tj("Greška (program vjernosti): ")+r.error.message);return;}
 narudzbe=[]; ture=[]; poruke=[]; mojaId=null;
 alert(tj("Sve narudžbe, ture i program vjernosti su obrisani."));
 await osvjezi(); crtaj(1);}

async function ucitajPovijest(){
 kuhTab="povijest";
 if(!povOd){const d=new Date();povDo=d.toISOString().slice(0,10);
  povOd=new Date(d.getTime()-6*864e5).toISOString().slice(0,10);}
 const r=await sb.from("narudzbe").select("*, stavke(*)").eq("lokal_id",lokal.id)
  .in("stanje",["dostavljeno","otkazano"])
  .gte("stvoreno",povOd+"T00:00:00").lte("stvoreno",povDo+"T23:59:59")
  .order("stvoreno",{ascending:false});
 povijest=r.error?[]:r.data;
 crtaj(1);}
function povijestHTML(){
 const dost=povijest.filter(o=>o.stanje==="dostavljeno");
 const promet=dost.reduce((s,o)=>s+ +o.iznos,0);
 const kes=dost.filter(o=>o.placanje==="gotovina").reduce((s,o)=>s+ +o.iznos,0);
 return `<div class="podtab">
  <button aria-selected="false" onclick="kuhTab='rad';crtaj(1)">Radna ploča</button>
  <button aria-selected="true">Povijest narudžbi</button></div>
 <div class="box">
  <div class="row2" style="margin-top:0">
   ${[[0,"Danas"],[6,"7 dana"],[29,"30 dana"],[89,"3 mjeseca"]].map(([d,n])=>
    `<button class="btn sm tiho" onclick="rasponPovijesti(${d})">${n}</button>`).join("")}</div>
  <label class="f" for="p-od">Od</label>
  <input class="f" type="date" id="p-od" value="${povOd}" onchange="povOd=this.value;ucitajPovijest()">
  <label class="f" for="p-do">Do</label>
  <input class="f" type="date" id="p-do" value="${povDo}" onchange="povDo=this.value;ucitajPovijest()">
  <div class="stat" style="margin-top:14px">
   <div><span>DOSTAVLJENO</span><b>${dost.length}</b></div>
   <div><span>PROMET</span><b>${promet.toFixed(0)} €</b></div>
   <div><span>GOTOVINA</span><b>${kes.toFixed(0)} €</b></div></div></div>
 ${povijest.length?povijest.map(o=>`<div class="ord">
   <div class="ord-h"><div><div class="ord-br">#${o.broj}</div>
    <div class="ord-t mono">${new Date(o.stvoreno).toLocaleDateString("hr-HR")} · ${sat(o.stvoreno)}</div></div>
    <span class="tag ${o.stanje==="otkazano"?"t-novo":"t-spr"}">${o.stanje==="otkazano"?"Otkazano":"Dostavljeno"}</span></div>
   <div class="kratko">${o.naselje?`<span class="kvart-oz">${esc(o.naselje)}</span>`:""}
    <span class="adr-kratko">${esc(o.adresa)}</span></div>
   <div class="povredak">
    <div><span>Gost</span><b>${esc(o.ime)} · ${esc(o.telefon)}</b></div>
    <div><span>Naručeno</span><b>${(o.stavke||[]).map(x=>esc(x.naziv)).join(", ")||"—"}</b></div>
    <div><span>Iznos</span><b>${eur(o.iznos)} · ${esc(o.placanje)}</b></div>
    <div><span>Vozač</span><b>${o.vozac?esc(o.vozac):"—"}</b></div>
    <div><span>Krenuo</span><b>${o.krenula_u?sat(o.krenula_u):"—"}</b></div>
    <div><span>Dostavljeno</span><b>${o.dostavljeno_u?sat(o.dostavljeno_u):"—"}</b></div>
    ${o.razlog?`<div><span>Razlog</span><b style="color:var(--red)">${esc(o.razlog)}</b></div>`:""}
   </div></div>`).join(""):`<div class="prazno"><strong>Nema narudžbi</strong>U odabranom razdoblju nema zapisa.</div>`}`;}
function rasponPovijesti(d){
 const n=new Date();povDo=n.toISOString().slice(0,10);
 povOd=new Date(n.getTime()-d*864e5).toISOString().slice(0,10);
 ucitajPovijest();}
function ulazK(){if(el("kl").value===LOZ_KUHINJA()){kuhUlaz=true;crtaj();}else el("kle").classList.add("on");}
function blizina(o){
 if(!o.lat)return "";
 const bl=narudzbe.filter(x=>x.id!==o.id&&x.lat&&["novo","u_pripremi","spremno"].includes(x.stanje)
  &&km(x,o)<=MAX_KM_MEDU&&razKut(azimut(L(),x),azimut(L(),o))<=MAX_KUT);
 if(!bl.length)return "";
 return `<div class="zajedno"><b>MOŽE ZAJEDNO S ${bl.map(x=>"#"+x.broj).join(" I ")}</b>
  <span>Iste su strane grada — isplati se pripremiti ih zajedno. ${
   bl.map(x=>esc(x.adresa.split(",")[0])).join(" · ")}</span></div>`;}

function kartica(o,gumbi){
 const osobno=o.nacin==="osobno";
 const vrijemeDo=o.preuzimanje_min?sat(new Date(o.stvoreno).getTime()+o.preuzimanje_min*60000):null;
 const t=o.stanje==="novo"?["t-novo","Novo"]:o.stanje==="u_pripremi"?["t-prip","U pripremi"]
  :o.stanje==="spremno"?["t-spr",osobno?"Čeka preuzimanje":"Spremno"]:["t-dost","U dostavi"];
 const mp=poruke.filter(p=>p.narudzba_id===o.id);
 const novaP=mp.length&&mp[mp.length-1].od==="gost";
 const otv=otvorene.has(o.id)||novaP;
 return `<div class="ord ${o.stanje==="novo"?"novo":""} ${osobno?"osobno":""} ${otv?"":"zbijeno"}">
  <div class="ord-h" onclick="prebaci('${o.id}')" role="button" tabindex="0">
   <div><div class="ord-br">#${o.broj}</div>
   <div class="ord-t mono">${sat(o.stvoreno)}${o.eta?` · iz peći za ${o.eta}′`:""}</div></div>
   <div style="display:flex;gap:8px;align-items:center">
    ${novaP?`<span class="tag" style="background:rgba(62,156,201,.25);color:var(--pice)">poruka</span>`:""}
    ${osobno?`<span class="tag t-osobno">🏠 OSOBNO${vrijemeDo?" · dolazi "+vrijemeDo:""}</span>`:""}
    <span class="tag ${t[0]}">${t[1]}</span>
    <span class="strelica">${otv?"▲":"▼"}</span></div></div>
  ${bedzGosta(o)}
  <div style="margin-top:11px">
   ${(o.stavke||[]).map(s=>`<div class="stavka ${s.gratis?"besplatna":""}">
    <div class="glavno"><div class="ime">1× ${esc(s.naziv)}
     ${s.gratis?'<span class="oznaka-gratis">NAGRADNA</span>':""}</div>
     <div class="cij">${eur(s.cijena)}</div></div>
    ${s.dodaci?`<div class="l-dod"><b>DODACI</b><span>${esc(s.dodaci)}</span></div>`:""}
    ${pica_(s.uz)?`<div class="l-pice"><b>PIĆE</b><span>${esc(pica_(s.uz))}</span></div>`:""}
    ${des_(s.uz)?`<div class="l-des"><b>DESERT</b><span>${esc(des_(s.uz))}</span></div>`:""}</div>`).join("")}
   </div>
  <button class="vise" onclick="prebaci('${o.id}')" aria-expanded="${otv}">${otv?"▲ Sakrij detalje":"▼ Vrijeme, adresa i poruke"}</button>
  <div class="sklop">
  ${o.gratis_pice?`<div class="stavka"><div class="glavno">
    <div class="ime male" style="color:var(--or)">${o.gratis_pice}× COCA-COLA 0,33 GRATIS</div>
    <div class="cij">0,00 €</div></div></div>`:""}
  <div class="tot"><span>Naplatiti</span><span>${eur(o.iznos)}</span></div>
  <div class="nacin ${o.placanje==="gotovina"?"n-kes":"n-kar"}">Naplata: ${esc(o.placanje)}</div>
  ${osobno?`<div class="kratko"><span class="tag t-osobno">🏠 Osobno preuzimanje${vrijemeDo?" — dolazi oko "+vrijemeDo:""}</span></div>`
   :`<div class="kratko">${o.naselje?`<span class="kvart-oz">${esc(o.naselje)}</span>`:""}
   <span class="adr-kratko">${esc(o.adresa)}</span></div>`}
  ${blizina(o)}
  ${gumbi||""}
  <div class="dostava-box"><b>${osobno?"PODACI ZA PREUZIMANJE":"PODACI ZA DOSTAVU"}</b>
   <div class="dp-ime">${esc(o.ime)}</div>
   ${osobno?"":`<a class="dp-adr" target="_blank" rel="noopener"
    href="${trazi(o.adresa)}">${esc(o.adresa)}</a>`}
   <a class="dp-tel" href="${telH(o.telefon)}">${esc(o.telefon)}</a>

async function grupiraj(){
 const sv=await sb.from("narudzbe").select("*").eq("lokal_id",lokal.id)
  .eq("stanje","spremno").is("tura_id",null);
 if(sv.error)return;
 // osobno preuzimanje ide gostu u ruke, ne vozacu — ne grupiraj ih u ture
 let slob=sv.data.filter(o=>o.nacin!=="osobno");
 // narudzbe bez pronadene adrese idu svaka u svoju turu
 for(const o of slob.filter(x=>!x.lat)){
  const t=await sb.from("ture").insert({lokal_id:lokal.id,stanje:"ponudjena",
   kvart:(o.naselje||o.adresa.split(",")[0]||"Dostava").trim(),ukupno_km:0}).select().single();
  if(!t.error)await sb.from("narudzbe").update({tura_id:t.data.id}).eq("id",o.id);}
 slob=slob.filter(o=>o.lat);
 while(slob.length){
  const sj=slob.reduce((a,b)=>km(L(),b)>km(L(),a)?b:a);
  const az=azimut(L(),sj);
  const gr=[sj].concat(slob.filter(o=>o.id!==sj.id)
   .filter(o=>km(sj,o)<=MAX_KM_MEDU&&razKut(az,azimut(L(),o))<=MAX_KUT)
   .sort((a,b)=>km(sj,a)-km(sj,b)).slice(0,MAX_STANICA-1));
  let d=km(L(),gr[0]);
  for(let i=0;i<gr.length-1;i++)d+=km(gr[i],gr[i+1]);
  d+=km(gr[gr.length-1],L());
  const t=await sb.from("ture").insert({lokal_id:lokal.id,stanje:"ponudjena",
   kvart:(gr[0].naselje||gr[0].adresa||"Dostava").trim(),
   ukupno_km:cestKm(d)}).select().single();
  if(t.error)break;
  await sb.from("narudzbe").update({tura_id:t.data.id}).in("id",gr.map(o=>o.id));
  slob=slob.filter(o=>!gr.some(g=>g.id===o.id));}}
